          package com.omniventas.app;

          import android.animation.ObjectAnimator;
          import android.content.Intent;
          import android.os.Bundle;
          import android.view.View;
          import android.view.animation.AnimationUtils;
          import android.view.inputmethod.EditorInfo;
          import android.widget.Button;
          import android.widget.EditText;
          import android.widget.ProgressBar;
          import android.widget.TextView;
          import android.widget.Toast;
          import androidx.appcompat.app.AppCompatActivity;
          import androidx.cardview.widget.CardView;
          import com.omniventas.app.api.ApiService;
          import com.omniventas.app.api.RetrofitClient;
          import com.omniventas.app.models.LoginResponse;
          import com.omniventas.app.models.VendorLoginRequest;
          import com.omniventas.app.sync.SyncManager;
          import com.omniventas.app.utils.SessionManager;
          import com.omniventas.app.utils.TelegramLogger;
          import retrofit2.Call;
          import retrofit2.Callback;
          import retrofit2.Response;

          public class LoginActivity extends AppCompatActivity {
              private EditText etVendorId;
              private Button btnLogin;
              private CardView cardLogin;
              private ProgressBar progressBar;
              private TextView tvError;
              private SessionManager sessionManager;
              private TelegramLogger logger;

              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  setContentView(R.layout.activity_login);

                  sessionManager = new SessionManager(this);
                  logger = TelegramLogger.getInstance(this);

                  if (sessionManager.isLoggedIn()) {
                      irAlDashboard();
                      return;
                  }

                  etVendorId = findViewById(R.id.et_vendor_id);
                  btnLogin = findViewById(R.id.btn_login);
                  cardLogin = findViewById(R.id.card_login);
                  progressBar = findViewById(R.id.progressBar);
                  tvError = findViewById(R.id.tv_error);

                  if (etVendorId != null) {
                      etVendorId.setText("");
                  }

                  if (cardLogin != null) {
                      cardLogin.startAnimation(AnimationUtils.loadAnimation(this, R.anim.slide_up));
                  }

                  btnLogin.setOnClickListener(v -> realizarLogin());

                  if (etVendorId != null) {
                      etVendorId.setOnEditorActionListener((v, actionId, event) -> {
                          if (actionId == EditorInfo.IME_ACTION_DONE) {
                              realizarLogin();
                              return true;
                          }
                          return false;
                      });
                  }
              }

              private void realizarLogin() {
                  String vendorId = etVendorId.getText().toString().trim().toUpperCase();

                  if (vendorId.isEmpty()) {
                      mostrarError("Ingresa tu ID de vendedor");
                      shakeView(etVendorId);
                      return;
                  }

                  if (vendorId.length() != 8) {
                      mostrarError("El ID debe tener 8 caracteres");
                      shakeView(etVendorId);
                      return;
                  }

                  if (!vendorId.matches("[A-Z0-9]+")) {
                      mostrarError("Solo letras y números");
                      shakeView(etVendorId);
                      return;
                  }

                  setLoading(true);
                  ocultarError();

                  ApiService apiService = RetrofitClient.getInstance(this).getApiService();
                  VendorLoginRequest request = new VendorLoginRequest(vendorId);

                  apiService.loginVendor(request).enqueue(new Callback<LoginResponse>() {
                      @Override
                      public void onResponse(Call<LoginResponse> call, Response<LoginResponse> response) {
                          setLoading(false);
                          if (response.isSuccessful() && response.body() != null) {
                              LoginResponse loginResponse = response.body();
                              if (loginResponse.isSuccess()) {
                                  String token = loginResponse.getToken();
                                  LoginResponse.Vendor vendor = loginResponse.getVendor();
                                  if (vendor != null && token != null) {
                                      sessionManager.saveUser(
                                          token,
                                          vendor.getId(),
                                          vendor.getName(),
                                          vendor.getBusinessName(),
                                          vendor.getUserId()
                                      );
                                      logger.success("Login exitoso: " + vendor.getName());
                                      
                                      SyncManager.scheduleSync(getApplicationContext());
                                      
                                      irAlDashboard();
                                  }
                              } else {
                                  String msg = loginResponse.getMessage() != null ? loginResponse.getMessage() : "ID inválido";
                                  mostrarError(msg);
                                  logger.warning("Login fallido: " + msg);
                              }
                          } else {
                              mostrarError("Error del servidor. Código: " + response.code());
                          }
                      }

                      @Override
                      public void onFailure(Call<LoginResponse> call, Throwable t) {
                          setLoading(false);
                          mostrarError("Error de conexión");
                          logger.networkError(t);
                      }
                  });
              }

              private void irAlDashboard() {
                  startActivity(new Intent(this, MainActivity.class));
                  finish();
              }

              private void setLoading(boolean loading) {
                  btnLogin.setEnabled(!loading);
                  btnLogin.setText(loading ? "Verificando..." : "Ingresar");
                  progressBar.setVisibility(loading ? View.VISIBLE : View.GONE);
              }

              private void mostrarError(String mensaje) {
                  tvError.setText(mensaje);
                  tvError.setVisibility(View.VISIBLE);
              }

              private void ocultarError() {
                  tvError.setVisibility(View.GONE);
              }

              private void shakeView(View view) {
                  ObjectAnimator shake = ObjectAnimator.ofFloat(view, "translationX", 0f, -20f, 20f, -20f, 20f, -10f, 10f, 0f);
                  shake.setDuration(500);
                  shake.start();
              }

              @Override
              protected void onResume() {
                  super.onResume();
                  if (sessionManager.isLoggedIn()) {
                      irAlDashboard();
                  }
              }
          }
          EOF

      - name: Create MainActivity
        run: |
          cd android-app
          
          cat > app/src/main/java/com/omniventas/app/MainActivity.java << 'EOF'
          package com.omniventas.app;

          import android.os.Bundle;
          import android.view.MenuItem;
          import android.view.View;
          import android.widget.LinearLayout;
          import android.widget.Toast;
          import androidx.annotation.NonNull;
          import androidx.appcompat.app.AppCompatActivity;
          import androidx.fragment.app.Fragment;
          import com.google.android.material.bottomnavigation.BottomNavigationView;
          import com.omniventas.app.sync.SyncManager;
          import com.omniventas.app.ui.DashboardFragment;
          import com.omniventas.app.ui.VentasFragment;
          import com.omniventas.app.ui.InventarioFragment;
          import com.omniventas.app.ui.UsuarioFragment;
          import com.omniventas.app.utils.SessionManager;
          import com.omniventas.app.utils.TelegramLogger;

          public class MainActivity extends AppCompatActivity {
              private BottomNavigationView bottomNav;
              private long backPressedTime = 0;
              private SessionManager sessionManager;
              private TelegramLogger logger;
              private LinearLayout llOfflineIndicator;

              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  setContentView(R.layout.activity_main);

                  sessionManager = new SessionManager(this);
                  logger = TelegramLogger.getInstance(this);

                  if (!sessionManager.isLoggedIn()) {
                      Toast.makeText(this, "Sesión expirada", Toast.LENGTH_SHORT).show();
                      finish();
                      return;
                  }

                  llOfflineIndicator = findViewById(R.id.ll_offline_indicator);
                  
                  checkConnectivity();

                  bottomNav = findViewById(R.id.bottom_navigation);
                  bottomNav.setOnItemSelectedListener(this::onNavigationItemSelected);

                  if (savedInstanceState == null) {
                      getSupportFragmentManager().beginTransaction()
                          .replace(R.id.fragment_container, new DashboardFragment(), "dashboard")
                          .commit();
                  }

                  SyncManager.scheduleSync(this);
              }

              private void checkConnectivity() {
                  llOfflineIndicator.setVisibility(View.VISIBLE);
                  SyncManager.syncNow(this);
                  
                  android.os.Handler handler = new android.os.Handler();
                  handler.postDelayed(() -> {
                      llOfflineIndicator.setVisibility(View.GONE);
                  }, 3000);
              }

              private boolean onNavigationItemSelected(@NonNull MenuItem item) {
                  Fragment selectedFragment = null;
                  String tag = "";
                  if (item.getItemId() == R.id.nav_dashboard) {
                      selectedFragment = new DashboardFragment();
                      tag = "dashboard";
                  } else if (item.getItemId() == R.id.nav_ventas) {
                      selectedFragment = new VentasFragment();
                      tag = "ventas";
                  } else if (item.getItemId() == R.id.nav_inventario) {
                      selectedFragment = new InventarioFragment();
                      tag = "inventario";
                  } else if (item.getItemId() == R.id.nav_usuario) {
                      selectedFragment = new UsuarioFragment();
                      tag = "usuario";
                  }

                  if (selectedFragment != null) {
                      getSupportFragmentManager().beginTransaction()
                          .replace(R.id.fragment_container, selectedFragment, tag)
                          .commit();
                      return true;
                  }
                  return false;
              }

              @Override
              public void onBackPressed() {
                  if (backPressedTime + 2000 > System.currentTimeMillis()) {
                      super.onBackPressed();
                      finish();
                  } else {
                      Toast.makeText(this, "Presiona de nuevo para salir", Toast.LENGTH_SHORT).show();
                      backPressedTime = System.currentTimeMillis();
                  }
              }
          }
