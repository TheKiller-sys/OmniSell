name: Build Android App (Production)

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    permissions:
      contents: write
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Create Production Android Project
        run: |
          echo "🚀 Creando proyecto Android para PRODUCCIÓN..."
          
          mkdir -p android-app/app/src/main/java/com/omniventas/app
          mkdir -p android-app/app/src/main/java/com/omniventas/app/api
          mkdir -p android-app/app/src/main/java/com/omniventas/app/models
          mkdir -p android-app/app/src/main/java/com/omniventas/app/ui
          mkdir -p android-app/app/src/main/java/com/omniventas/app/utils
          mkdir -p android-app/app/src/main/java/com/omniventas/app/adapters
          mkdir -p android-app/app/src/main/res/layout
          mkdir -p android-app/app/src/main/res/values
          mkdir -p android-app/app/src/main/res/drawable
          mkdir -p android-app/app/src/main/res/drawable-v24
          mkdir -p android-app/app/src/main/res/menu
          mkdir -p android-app/app/src/main/res/xml
          mkdir -p android-app/app/src/main/res/mipmap-hdpi
          mkdir -p android-app/app/src/main/res/mipmap-mdpi
          mkdir -p android-app/app/src/main/res/mipmap-xhdpi
          mkdir -p android-app/app/src/main/res/mipmap-xxhdpi
          mkdir -p android-app/app/src/main/res/mipmap-xxxhdpi
          mkdir -p android-app/app/src/main/res/mipmap-anydpi-v26
          mkdir -p android-app/app/src/main/res/anim
          mkdir -p android-app/gradle/wrapper
          
          cd android-app

      - name: Create gradle wrapper
        run: |
          cd android-app
          echo "distributionBase=GRADLE_USER_HOME" > gradle/wrapper/gradle-wrapper.properties
          echo "distributionPath=wrapper/dists" >> gradle/wrapper/gradle-wrapper.properties
          echo "distributionUrl=https://services.gradle.org/distributions/gradle-8.2-bin.zip" >> gradle/wrapper/gradle-wrapper.properties
          echo "zipStoreBase=GRADLE_USER_HOME" >> gradle/wrapper/gradle-wrapper.properties
          echo "zipStorePath=wrapper/dists" >> gradle/wrapper/gradle-wrapper.properties
          
          curl -L -o gradle/wrapper/gradle-wrapper.jar \
            https://raw.githubusercontent.com/gradle/gradle/v8.2.0/gradle/wrapper/gradle-wrapper.jar
          
          cat > gradlew << 'EOF'
          #!/bin/sh
          APP_HOME=$(cd "$(dirname "$0")" && pwd)
          CLASSPATH=$APP_HOME/gradle/wrapper/gradle-wrapper.jar
          exec java -cp "$CLASSPATH" org.gradle.wrapper.GradleWrapperMain "$@"
          EOF
          chmod +x gradlew

      - name: Create gradle files
        run: |
          cd android-app
          
          cat > gradle.properties << 'EOF'
          android.useAndroidX=true
          android.enableJetifier=true
          org.gradle.jvmargs=-Xmx2048m -XX:MaxMetaspaceSize=512m
          org.gradle.parallel=true
          org.gradle.caching=true
          EOF
          
          cat > settings.gradle << 'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "OmniVentas"
          include ':app'
          EOF
          
          cat > build.gradle << 'EOF'
          plugins {
              id 'com.android.application' version '8.2.0' apply false
          }
          EOF

      - name: Create app build.gradle
        run: |
          cd android-app
          cat > app/build.gradle << 'EOF'
          plugins {
              id 'com.android.application'
          }
          
          android {
              namespace 'com.omniventas.app'
              compileSdk 34
          
              defaultConfig {
                  applicationId "com.omniventas.app"
                  minSdk 21
                  targetSdk 34
                  versionCode 4
                  versionName "4.0.0"
                  testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
              }
          
              buildTypes {
                  release {
                      minifyEnabled true
                      proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
                  }
                  debug {
                      minifyEnabled false
                      debuggable true
                  }
              }
          
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_1_8
                  targetCompatibility JavaVersion.VERSION_1_8
              }
          }
          
          dependencies {
              implementation 'androidx.appcompat:appcompat:1.6.1'
              implementation 'com.google.android.material:material:1.10.0'
              implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
              implementation 'androidx.recyclerview:recyclerview:1.3.2'
              implementation 'androidx.cardview:cardview:1.0.0'
              implementation 'androidx.swiperefreshlayout:swiperefreshlayout:1.1.0'
              implementation 'androidx.security:security-crypto:1.1.0-alpha06'
              implementation 'com.squareup.retrofit2:retrofit:2.9.0'
              implementation 'com.squareup.retrofit2:converter-gson:2.9.0'
              implementation 'com.squareup.okhttp3:logging-interceptor:4.11.0'
              implementation 'com.auth0:java-jwt:4.4.0'
              implementation 'com.google.code.gson:gson:2.10.1'
              implementation 'com.github.bumptech.glide:glide:4.16.0'
              testImplementation 'junit:junit:4.13.2'
              androidTestImplementation 'androidx.test.ext:junit:1.1.5'
              androidTestImplementation 'androidx.test.espresso:espresso-core:3.5.1'
          }
          EOF
          
          cat > app/proguard-rules.pro << 'EOF'
          -keep class com.omniventas.app.** { *; }
          -keep class retrofit2.** { *; }
          -keep class okhttp3.** { *; }
          -keep class com.google.gson.** { *; }
          -dontwarn okhttp3.**
          -dontwarn retrofit2.**
          EOF

      - name: Create AndroidManifest
        run: |
          cd android-app
          cat > app/src/main/AndroidManifest.xml << 'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android"
              xmlns:tools="http://schemas.android.com/tools">
          
              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />
              <uses-permission android:name="android.permission.ACCESS_WIFI_STATE" />
          
              <application
                  android:allowBackup="true"
                  android:icon="@mipmap/ic_launcher"
                  android:label="@string/app_name"
                  android:roundIcon="@mipmap/ic_launcher_round"
                  android:supportsRtl="true"
                  android:theme="@style/Theme.OmniVentas"
                  android:usesCleartextTraffic="true"
                  android:networkSecurityConfig="@xml/network_security_config"
                  android:hardwareAccelerated="true"
                  tools:targetApi="31">
          
                  <activity
                      android:name=".LoginActivity"
                      android:exported="true"
                      android:screenOrientation="portrait"
                      android:windowSoftInputMode="adjustResize"
                      android:theme="@style/Theme.OmniVentas.Login">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
          
                  <activity
                      android:name=".MainActivity"
                      android:exported="false"
                      android:screenOrientation="portrait"
                      android:windowSoftInputMode="adjustResize" />
          
              </application>
          
          </manifest>
          EOF

      - name: Create network security config
        run: |
          cd android-app
          cat > app/src/main/res/xml/network_security_config.xml << 'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <network-security-config>
              <domain-config cleartextTrafficPermitted="true">
                  <domain includeSubdomains="true">10.0.2.2</domain>
                  <domain includeSubdomains="true">localhost</domain>
                  <domain includeSubdomains="true">prueba-1-omni.onrender.com</domain>
                  <domain includeSubdomains="true">onrender.com</domain>
              </domain-config>
          </network-security-config>
          EOF

      - name: Create animation files
        run: |
          cd android-app
          
          cat > app/src/main/res/anim/fade_in.xml << 'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <alpha xmlns:android="http://schemas.android.com/apk/res/android"
              android:fromAlpha="0.0"
              android:toAlpha="1.0"
              android:duration="600" />
          EOF
          
          cat > app/src/main/res/anim/slide_up.xml << 'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <translate xmlns:android="http://schemas.android.com/apk/res/android"
              android:fromYDelta="100%"
              android:toYDelta="0%"
              android:duration="600" />
          EOF
          
          cat > app/src/main/res/anim/slide_down.xml << 'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <translate xmlns:android="http://schemas.android.com/apk/res/android"
              android:fromYDelta="0%"
              android:toYDelta="100%"
              android:duration="300" />
          EOF
          
          cat > app/src/main/res/anim/scale_up.xml << 'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <scale xmlns:android="http://schemas.android.com/apk/res/android"
              android:fromXScale="0.8"
              android:toXScale="1.0"
              android:fromYScale="0.8"
              android:toYScale="1.0"
              android:pivotX="50%"
              android:pivotY="50%"
              android:duration="400" />
          EOF

      - name: Create colors
        run: |
          cd android-app
          cat > app/src/main/res/values/colors.xml << 'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <color name="primary">#6366F1</color>
              <color name="primary_dark">#4F46E5</color>
              <color name="primary_light">#818CF8</color>
              <color name="primary_gradient_start">#6366F1</color>
              <color name="primary_gradient_end">#8B5CF6</color>
              <color name="secondary">#8B5CF6</color>
              <color name="secondary_light">#A78BFA</color>
              <color name="success">#10B981</color>
              <color name="success_light">#D1FAE5</color>
              <color name="warning">#F59E0B</color>
              <color name="warning_light">#FEF3C7</color>
              <color name="danger">#EF4444</color>
              <color name="danger_light">#FEE2E2</color>
              <color name="info">#3B82F6</color>
              <color name="info_light">#DBEAFE</color>
              <color name="dark">#1F2937</color>
              <color name="dark_secondary">#374151</color>
              <color name="gray">#6B7280</color>
              <color name="gray_light">#E5E7EB</color>
              <color name="light_gray">#F3F4F6</color>
              <color name="white">#FFFFFF</color>
              <color name="white_alpha_80">#CCFFFFFF</color>
              <color name="bottom_nav_tint">@color/primary</color>
              <color name="bottom_nav_background">@color/white</color>
              <color name="card_ventas_hoy">#EEF2FF</color>
              <color name="card_ingresos_hoy">#ECFDF5</color>
              <color name="card_ventas_mes">#EFF6FF</color>
              <color name="card_ingresos_mes">#FEF3C7</color>
          </resources>
          EOF

      - name: Create strings
        run: |
          cd android-app
          cat > app/src/main/res/values/strings.xml << 'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <string name="app_name">OmniVentas</string>
              <string name="login_title">OmniVentas</string>
              <string name="login_subtitle">Acceso para Vendedores</string>
              <string name="login_hint">ID de Vendedor</string>
              <string name="login_button">Ingresar</string>
              <string name="login_help">Contacta al administrador para obtener tu ID</string>
              <string name="login_error_empty">Ingresa tu ID de vendedor</string>
              <string name="login_error_length">El ID debe tener 8 caracteres</string>
              <string name="login_error_chars">Solo letras y números</string>
              <string name="registrar_venta">Registrar Venta</string>
              <string name="buscar_producto">Buscar producto...</string>
              <string name="cantidad">Cantidad</string>
              <string name="total">Total</string>
              <string name="cancelar">Cancelar</string>
              <string name="registrar">Registrar</string>
              <string name="ventas_hoy">Ventas de Hoy</string>
              <string name="sin_ventas_hoy">No hay ventas registradas hoy</string>
              <string name="inventario">Inventario</string>
              <string name="productos">Productos</string>
              <string name="stock_bajo">Stock Bajo</string>
              <string name="sin_stock">Sin Stock</string>
              <string name="cargando">Cargando...</string>
              <string name="error_conexion">Error de conexión</string>
          </resources>
          EOF

      - name: Create themes
        run: |
          cd android-app
          cat > app/src/main/res/values/themes.xml << 'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <style name="Theme.OmniVentas" parent="Theme.MaterialComponents.DayNight.NoActionBar">
                  <item name="colorPrimary">@color/primary</item>
                  <item name="colorPrimaryVariant">@color/primary_dark</item>
                  <item name="colorOnPrimary">@color/white</item>
                  <item name="colorSecondary">@color/secondary</item>
                  <item name="colorOnSecondary">@color/white</item>
                  <item name="android:statusBarColor">@color/primary_dark</item>
                  <item name="android:windowBackground">@color/light_gray</item>
                  <item name="android:windowAnimationStyle">@style/WindowAnimationTransition</item>
              </style>
          
              <style name="Theme.OmniVentas.Login" parent="Theme.OmniVentas">
                  <item name="android:statusBarColor">@color/primary_dark</item>
                  <item name="android:windowBackground">@color/white</item>
              </style>
          
              <style name="WindowAnimationTransition">
                  <item name="android:windowEnterAnimation">@anim/fade_in</item>
                  <item name="android:windowExitAnimation">@anim/fade_in</item>
              </style>
          
              <style name="CardViewStyle" parent="CardView">
                  <item name="cardCornerRadius">16dp</item>
                  <item name="cardElevation">8dp</item>
                  <item name="cardBackgroundColor">@color/white</item>
              </style>
          
              <style name="StatCardStyle" parent="CardViewStyle">
                  <item name="cardCornerRadius">16dp</item>
                  <item name="cardElevation">4dp</item>
              </style>
          
              <style name="DialogStyle" parent="Theme.MaterialComponents.Light.Dialog">
                  <item name="android:windowBackground">@android:color/transparent</item>
                  <item name="android:windowIsFloating">true</item>
                  <item name="android:windowContentOverlay">@null</item>
                  <item name="android:windowAnimationStyle">@style/DialogAnimation</item>
              </style>
          
              <style name="DialogAnimation" parent="@android:style/Animation.Dialog">
                  <item name="android:windowEnterAnimation">@anim/slide_up</item>
                  <item name="android:windowExitAnimation">@anim/slide_down</item>
              </style>
          </resources>
          EOF

      - name: Create drawables - Login
        run: |
          cd android-app
          
          cat > app/src/main/res/drawable/bg_login_gradient.xml << 'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <shape xmlns:android="http://schemas.android.com/apk/res/android">
              <gradient
