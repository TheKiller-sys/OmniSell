      # ============================================
      # SUBIR LOS ARCHIVOS FUENTE AL REPOSITORIO
      # ============================================
      - name: Push source files to repository
        run: |
          echo "📤 Subiendo archivos fuente al repositorio..."
          
          # Configurar git
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          
          # Agregar los archivos de android-app
          git add android-app/
          
          # Verificar si hay cambios
          if git diff --staged --quiet; then
            echo "✅ No hay cambios nuevos en android-app/"
          else
            git commit -m "🤖 Update Android app source files [skip ci]"
            git push
            echo "✅ Archivos subidos al repositorio"
          fi

      # ============================================
      # COMPILAR APKS
      # ============================================
      - name: Build Debug APK
        run: |
          cd android-app
          ./gradlew assembleDebug --no-daemon

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: android-app/app/build/outputs/apk/debug/*.apk

      - name: Build Release APK
        run: |
          cd android-app
          ./gradlew assembleRelease --no-daemon

      - name: Upload Release APK (unsigned)
        uses: actions/upload-artifact@v4
        with:
          name: app-release-unsigned
          path: android-app/app/build/outputs/apk/release/*.apk

      # ============================================
      # FIRMAR APK (opcional)
      # ============================================
      - name: Check signing secrets
        id: check_secrets
        run: |
          if [ -n "${{ secrets.KEYSTORE_BASE64 }}" ] && \
             [ -n "${{ secrets.KEYSTORE_PASSWORD }}" ] && \
             [ -n "${{ secrets.KEY_ALIAS }}" ] && \
             [ -n "${{ secrets.KEY_PASSWORD }}" ]; then
            echo "has_secrets=true" >> $GITHUB_OUTPUT
            echo "✅ Secrets de firma encontrados"
          else
            echo "has_secrets=false" >> $GITHUB_OUTPUT
            echo "⚠️ Secrets de firma NO configurados"
          fi

      - name: Sign Release APK
        if: github.ref == 'refs/heads/main' && steps.check_secrets.outputs.has_secrets == 'true'
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > keystore.jks
          cd android-app
          ./gradlew assembleRelease \
            -Pandroid.injected.signing.store.file=$(pwd)/../keystore.jks \
            -Pandroid.injected.signing.store.password=${{ secrets.KEYSTORE_PASSWORD }} \
            -Pandroid.injected.signing.key.alias=${{ secrets.KEY_ALIAS }} \
            -Pandroid.injected.signing.key.password=${{ secrets.KEY_PASSWORD }}

      - name: Upload Signed APK
        if: github.ref == 'refs/heads/main' && steps.check_secrets.outputs.has_secrets == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: app-release-signed
          path: android-app/app/build/outputs/apk/release/*.apk

      - name: Notify success
        if: success()
        run: |
          echo "✅ APK compilados exitosamente!"
          echo "📱 Descarga los APKs desde los artifacts"
          echo "📂 Los archivos fuente están en tu repositorio en android-app/"
