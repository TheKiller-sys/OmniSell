name: Build Android APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Create complete Android project
        run: |
          echo "📱 Creando proyecto Android desde cero..."
          
          # Crear TODOS los directorios necesarios
          mkdir -p android-app/app/src/main/java/com/omniventas/app
          mkdir -p android-app/app/src/main/res/layout
          mkdir -p android-app/app/src/main/res/values
          mkdir -p android-app/app/src/main/res/drawable
          mkdir -p android-app/app/src/main/res/mipmap-hdpi
          mkdir -p android-app/app/src/main/res/mipmap-mdpi
          mkdir -p android-app/app/src/main/res/mipmap-xhdpi
          mkdir -p android-app/app/src/main/res/mipmap-xxhdpi
          mkdir -p android-app/app/src/main/res/mipmap-xxxhdpi
          mkdir -p android-app/app/src/main/res/mipmap-anydpi-v26
          mkdir -p android-app/app/src/main/res/menu
          mkdir -p android-app/gradle/wrapper
          
          cd android-app
          
          # ============================================
          # 0. CREAR gradle.properties
          # ============================================
          cat > gradle.properties << 'EOF'
          # AndroidX configuration
          android.useAndroidX=true
          android.enableJetifier=true
          
          # Gradle settings
          org.gradle.jvmargs=-Xmx2048m -XX:MaxMetaspaceSize=512m
          org.gradle.parallel=true
          org.gradle.caching=true
          org.gradle.daemon=true
          EOF
          
          # ============================================
          # 1. CREAR settings.gradle
          # ============================================
          cat > settings.gradle << 'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "OmniVentas"
          include ':app'
          EOF
          
          # ============================================
          # 2. CREAR build.gradle (proyecto)
          # ============================================
          cat > build.gradle << 'EOF'
          plugins {
              id 'com.android.application' version '8.2.0' apply false
          }
          EOF
          
          # ============================================
          # 3. CREAR build.gradle (app)
          # ============================================
          cat > app/build.gradle << 'EOF'
          plugins {
              id 'com.android.application'
          }
          
          android {
              namespace 'com.omniventas.app'
              compileSdk 34
          
              defaultConfig {
                  applicationId "com.omniventas.app"
                  minSdk 21
                  targetSdk 34
                  versionCode 1
                  versionName "1.0"
                  
                  testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
              }
          
              buildTypes {
                  release {
                      minifyEnabled false
                      proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
                  }
                  debug {
                      minifyEnabled false
                  }
              }
              
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_1_8
                  targetCompatibility JavaVersion.VERSION_1_8
              }
          }
          
          dependencies {
              implementation 'androidx.appcompat:appcompat:1.6.1'
              implementation 'com.google.android.material:material:1.9.0'
              implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
              implementation 'androidx.recyclerview:recyclerview:1.3.2'
              implementation 'androidx.cardview:cardview:1.0.0'
              
              testImplementation 'junit:junit:4.13.2'
              androidTestImplementation 'androidx.test.ext:junit:1.1.5'
              androidTestImplementation 'androidx.test.espresso:espresso-core:3.5.1'
          }
          EOF
          
          # ============================================
          # 4. CREAR AndroidManifest.xml
          # ============================================
          cat > app/src/main/AndroidManifest.xml << 'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android"
              xmlns:tools="http://schemas.android.com/tools">
          
              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />
          
              <application
                  android:allowBackup="true"
                  android:icon="@mipmap/ic_launcher"
                  android:label="@string/app_name"
                  android:roundIcon="@mipmap/ic_launcher_round"
                  android:supportsRtl="true"
                  android:theme="@style/Theme.OmniVentas"
                  android:usesCleartextTraffic="true"
                  tools:targetApi="31">
                  
                  <activity
                      android:name=".LoginActivity"
                      android:exported="true"
                      android:screenOrientation="portrait">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
                  
                  <activity
                      android:name=".MainActivity"
                      android:exported="false"
                      android:screenOrientation="portrait" />
                  
              </application>
          
          </manifest>
          EOF
          
          # ============================================
          # 5. CREAR LoginActivity.java
          # ============================================
          cat > app/src/main/java/com/omniventas/app/LoginActivity.java << 'EOF'
          package com.omniventas.app;
          
          import android.os.Bundle;
          import android.widget.Button;
          import android.widget.EditText;
          import android.widget.Toast;
          import androidx.appcompat.app.AppCompatActivity;
          
          public class LoginActivity extends AppCompatActivity {
              private EditText etBusinessId, etUsername, etPassword;
              private Button btnLogin;
          
              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  setContentView(R.layout.activity_login);
                  
                  etBusinessId = findViewById(R.id.et_business_id);
                  etUsername = findViewById(R.id.et_username);
                  etPassword = findViewById(R.id.et_password);
                  btnLogin = findViewById(R.id.btn_login);
                  
                  btnLogin.setOnClickListener(v -> {
                      Toast.makeText(this, "Login funcionando", Toast.LENGTH_SHORT).show();
                  });
              }
          }
          EOF
          
          # ============================================
          # 6. CREAR MainActivity.java
          # ============================================
          cat > app/src/main/java/com/omniventas/app/MainActivity.java << 'EOF'
          package com.omniventas.app;
          
          import android.os.Bundle;
          import android.widget.TextView;
          import androidx.appcompat.app.AppCompatActivity;
          
          public class MainActivity extends AppCompatActivity {
              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  setContentView(R.layout.activity_main);
                  
                  TextView textView = findViewById(R.id.textView);
                  textView.setText("¡OmniVentas funcionando!");
              }
          }
          EOF
          
          # ============================================
          # 7. CREAR activity_login.xml
          # ============================================
          cat > app/src/main/res/layout/activity_login.xml << 'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <LinearLayout xmlns:android="http://schemas.android.com/apk/res/android"
              xmlns:app="http://schemas.android.com/apk/res-auto"
              android:layout_width="match_parent"
              android:layout_height="match_parent"
              android:orientation="vertical"
              android:padding="24dp"
              android:gravity="center"
              android:background="@color/white">
          
              <ImageView
                  android:layout_width="80dp"
                  android:layout_height="80dp"
                  android:src="@drawable/ic_logo"
                  android:layout_marginBottom="16dp" />
          
              <TextView
                  android:layout_width="wrap_content"
                  android:layout_height="wrap_content"
                  android:text="OmniVentas"
                  android:textSize="28sp"
                  android:textStyle="bold"
                  android:textColor="@color/primary"
                  android:layout_marginBottom="8dp" />
          
              <TextView
                  android:layout_width="wrap_content"
                  android:layout_height="wrap_content"
                  android:text="Sistema de Gestión para Vendedores"
                  android:textSize="14sp"
                  android:textColor="@color/gray"
                  android:layout_marginBottom="32dp" />
          
              <EditText
                  android:id="@+id/et_business_id"
                  android:layout_width="match_parent"
                  android:layout_height="wrap_content"
                  android:hint="ID del Negocio"
                  android:inputType="text"
                  android:padding="14dp"
                  android:background="@drawable/edit_text_background"
                  android:layout_marginBottom="12dp" />
          
              <EditText
                  android:id="@+id/et_username"
                  android:layout_width="match_parent"
                  android:layout_height="wrap_content"
                  android:hint="Usuario"
                  android:inputType="text"
                  android:padding="14dp"
                  android:background="@drawable/edit_text_background"
                  android:layout_marginBottom="12dp" />
          
              <EditText
                  android:id="@+id/et_password"
                  android:layout_width="match_parent"
                  android:layout_height="wrap_content"
                  android:hint="Contraseña"
                  android:inputType="textPassword"
                  android:padding="14dp"
                  android:background="@drawable/edit_text_background"
                  android:layout_marginBottom="24dp" />
          
              <Button
                  android:id="@+id/btn_login"
                  android:layout_width="match_parent"
                  android:layout_height="wrap_content"
                  android:text="Iniciar Sesión"
                  android:textSize="16sp"
                  android:padding="14dp"
                  android:backgroundTint="@color/primary"
                  app:cornerRadius="12dp" />
          
          </LinearLayout>
          EOF
          
          # ============================================
          # 8. CREAR activity_main.xml
          # ============================================
          cat > app/src/main/res/layout/activity_main.xml << 'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <LinearLayout xmlns:android="http://schemas.android.com/apk/res/android"
              xmlns:app="http://schemas.android.com/apk/res-auto"
              android:layout_width="match_parent"
              android:layout_height="match_parent"
              android:orientation="vertical">
          
              <FrameLayout
                  android:id="@+id/fragment_container"
                  android:layout_width="match_parent"
                  android:layout_height="0dp"
                  android:layout_weight="1" />
          
              <com.google.android.material.bottomnavigation.BottomNavigationView
                  android:id="@+id/bottom_navigation"
                  android:layout_width="match_parent"
                  android:layout_height="wrap_content"
                  android:background="@color/white"
                  app:menu="@menu/bottom_nav_menu"
                  app:itemIconTint="@color/bottom_nav_tint"
                  app:itemTextColor="@color/bottom_nav_tint" />
          
          </LinearLayout>
          EOF
          
          # ============================================
          # 9. CREAR bottom_nav_menu.xml
          # ============================================
          cat > app/src/main/res/menu/bottom_nav_menu.xml << 'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <menu xmlns:android="http://schemas.android.com/apk/res/android">
              <item
                  android:id="@+id/nav_dashboard"
                  android:icon="@drawable/ic_dashboard"
                  android:title="Dashboard" />
              <item
                  android:id="@+id/nav_ventas"
                  android:icon="@drawable/ic_ventas"
                  android:title="Ventas" />
              <item
                  android:id="@+id/nav_inventario"
                  android:icon="@drawable/ic_inventario"
                  android:title="Inventario" />
              <item
                  android:id="@+id/nav_logout"
                  android:icon="@drawable/ic_logout"
                  android:title="Salir" />
          </menu>
          EOF
          
          # ============================================
          # 10. CREAR TODOS los drawables (íconos)
          # ============================================
          # ic_logo
          cat > app/src/main/res/drawable/ic_logo.xml << 'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="24dp"
              android:height="24dp"
              android:viewportWidth="24"
              android:viewportHeight="24">
              <path
                  android:fillColor="#4361EE"
                  android:pathData="M12,2C6.48,2 2,6.48 2,12s4.48,10 10,10 10,-4.48 10,-10S17.52,2 12,2zm-2,15l-5,-5 1.41,-1.41L10,14.17l7.59,-7.59L19,8l-9,9z"/>
          </vector>
          EOF
          
          # ic_dashboard
          cat > app/src/main/res/drawable/ic_dashboard.xml << 'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="24dp"
              android:height="24dp"
              android:viewportWidth="24"
              android:viewportHeight="24">
              <path
                  android:fillColor="#000000"
                  android:pathData="M3,13h8L11,3L3,3v10zM3,21h8v-6L3,15v6zM13,21h8L21,11h-8v10zM13,3v6h8L21,3h-8z"/>
          </vector>
          EOF
          
          # ic_ventas
          cat > app/src/main/res/drawable/ic_ventas.xml << 'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="24dp"
              android:height="24dp"
              android:viewportWidth="24"
              android:viewportHeight="24">
              <path
                  android:fillColor="#000000"
                  android:pathData="M7,18c-1.1,0 -2,0.9 -2,2s0.9,2 2,2 2,-0.9 2,-2 -0.9,-2 -2,-2zM1,2v2h2l3.6,7.59 -1.35,2.45C5.16,14.9 5.78,16 7,16h12v-2L7,14l1.1,-2h7.45c0.75,0 1.41,-0.41 1.75,-1.03l3.58,-6.49A1.996,1.996 0,0 0,20.01 4L5.21,4l-0.94,-2L1,2zM17,18c-1.1,0 -2,0.9 -2,2s0.9,2 2,2 2,-0.9 2,-2 -0.9,-2 -2,-2z"/>
          </vector>
          EOF
          
          # ic_inventario
          cat > app/src/main/res/drawable/ic_inventario.xml << 'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="24dp"
              android:height="24dp"
              android:viewportWidth="24"
              android:viewportHeight="24">
              <path
                  android:fillColor="#000000"
                  android:pathData="M20,6h-4V4c0,-1.1 -0.9,-2 -2,-2h-4C8.9,2 8,2.9 8,4v2H4c-1.1,0 -2,0.9 -2,2v12c0,1.1 0.9,2 2,2h16c1.1,0 2,-0.9 2,-2V8c0,-1.1 -0.9,-2 -2,-2zM10,4h4v2h-4V4zM4,20V8h4v10h8V8h4v12H4z"/>
          </vector>
          EOF
          
          # ic_logout
          cat > app/src/main/res/drawable/ic_logout.xml << 'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="24dp"
              android:height="24dp"
              android:viewportWidth="24"
              android:viewportHeight="24">
              <path
                  android:fillColor="#000000"
                  android:pathData="M17,7l-1.41,1.41L18.17,11H8v2h10.17l-2.58,2.58L17,17l5,-5zM4,5h8V3H4c-1.1,0 -2,0.9 -2,2v14c0,1.1 0.9,2 2,2h8v-2H4V5z"/>
          </vector>
          EOF
          
          # ============================================
          # 11. CREAR edit_text_background.xml
          # ============================================
          cat > app/src/main/res/drawable/edit_text_background.xml << 'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <shape xmlns:android="http://schemas.android.com/apk/res/android">
              <solid android:color="@color/white" />
              <stroke android:width="1dp" android:color="@color/gray" />
              <corners android:radius="8dp" />
          </shape>
          EOF
          
          # ============================================
          # 12. CREAR strings.xml
          # ============================================
          cat > app/src/main/res/values/strings.xml << 'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <string name="app_name">OmniVentas</string>
          </resources>
          EOF
          
          # ============================================
          # 13. CREAR colors.xml
          # ============================================
          cat > app/src/main/res/values/colors.xml << 'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <color name="primary">#4361EE</color>
              <color name="primary_dark">#3A56D4</color>
              <color name="secondary">#3F37C9</color>
              <color name="success">#4CC9F0</color>
              <color name="warning">#FFD166</color>
              <color name="danger">#EF476F</color>
              <color name="dark">#212529</color>
              <color name="light_gray">#F5F7FB</color>
              <color name="gray">#6C757D</color>
              <color name="white">#FFFFFF</color>
              <color name="bottom_nav_tint">@color/primary</color>
          </resources>
          EOF
          
          # ============================================
          # 14. CREAR themes.xml
          # ============================================
          cat > app/src/main/res/values/themes.xml << 'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <style name="Theme.OmniVentas" parent="Theme.MaterialComponents.DayNight.NoActionBar">
                  <item name="colorPrimary">@color/primary</item>
                  <item name="colorPrimaryVariant">@color/primary_dark</item>
                  <item name="colorOnPrimary">@color/white</item>
                  <item name="colorSecondary">@color/secondary</item>
                  <item name="colorOnSecondary">@color/white</item>
                  <item name="android:statusBarColor">@color/primary</item>
              </style>
          </resources>
          EOF
          
          # ============================================
          # 15. CREAR proguard-rules.pro
          # ============================================
          cat > app/proguard-rules.pro << 'EOF'
          # Add project specific ProGuard rules here.
          -keep class com.omniventas.app.** { *; }
          EOF
          
          # ============================================
          # 16. CREAR ic_launcher_foreground.xml
          # ============================================
          cat > app/src/main/res/drawable/ic_launcher_foreground.xml << 'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="108dp"
              android:height="108dp"
              android:viewportWidth="108"
              android:viewportHeight="108">
              <path
                  android:fillColor="#4361EE"
                  android:pathData="M54,27C40.5,27 30,37.5 30,51C30,64.5 40.5,75 54,75C67.5,75 78,64.5 78,51C78,37.5 67.5,27 54,27ZM54,69C44.1,69 36,60.9 36,51C36,41.1 44.1,33 54,33C63.9,33 72,41.1 72,51C72,60.9 63.9,69 54,69ZM54,39C47.4,39 42,44.4 42,51C42,57.6 47.4,63 54,63C60.6,63 66,57.6 66,51C66,44.4 60.6,39 54,39Z"/>
              <path
                  android:fillColor="#FFFFFF"
                  android:pathData="M54,45C50.7,45 48,47.7 48,51C48,54.3 50.7,57 54,57C57.3,57 60,54.3 60,51C60,47.7 57.3,45 54,45Z"/>
          </vector>
          EOF
          
          # ============================================
          # 17. CREAR adaptive icons
          # ============================================
          cat > app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml << 'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">
              <background android:drawable="@color/primary"/>
              <foreground android:drawable="@drawable/ic_launcher_foreground"/>
          </adaptive-icon>
          EOF
          
          cat > app/src/main/res/mipmap-anydpi-v26/ic_launcher_round.xml << 'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">
              <background android:drawable="@color/primary"/>
              <foreground android:drawable="@drawable/ic_launcher_foreground"/>
          </adaptive-icon>
          EOF
          
          # ============================================
          # 18. CREAR iconos PNG (placeholders)
          # ============================================
          # Crear PNGs transparentes para evitar errores de compilación
          for dir in mipmap-mdpi mipmap-hdpi mipmap-xhdpi mipmap-xxhdpi mipmap-xxxhdpi; do
            # PNG transparente de 1x1 pixel en base64
            echo -n "iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAYAAAAfFcSJAAAADUlEQVR42mP8z8BQDwAEhQGAhKmMIQAAAABJRU5ErkJggg==" | base64 -d > app/src/main/res/$dir/ic_launcher.png
            echo -n "iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAYAAAAfFcSJAAAADUlEQVR42mP8z8BQDwAEhQGAhKmMIQAAAABJRU5ErkJggg==" | base64 -d > app/src/main/res/$dir/ic_launcher_round.png
          done
          
          # ============================================
          # 19. CREAR gradle-wrapper.properties
          # ============================================
          cat > gradle/wrapper/gradle-wrapper.properties << 'EOF'
          distributionBase=GRADLE_USER_HOME
          distributionPath=wrapper/dists
          distributionUrl=https\://services.gradle.org/distributions/gradle-8.2-bin.zip
          zipStoreBase=GRADLE_USER_HOME
          zipStorePath=wrapper/dists
          EOF
          
          # ============================================
          # 20. DESCARGAR gradle-wrapper.jar
          # ============================================
          curl -L -o gradle/wrapper/gradle-wrapper.jar \
            https://raw.githubusercontent.com/gradle/gradle/v8.2.0/gradle/wrapper/gradle-wrapper.jar
          
          # ============================================
          # 21. CREAR gradlew
          # ============================================
          cat > gradlew << 'EOF'
          #!/bin/sh
          # Gradle startup script
          APP_HOME=$(cd "$(dirname "$0")" && pwd)
          CLASSPATH=$APP_HOME/gradle/wrapper/gradle-wrapper.jar
          exec java -cp "$CLASSPATH" org.gradle.wrapper.GradleWrapperMain "$@"
          EOF
          chmod +x gradlew
          
          # ============================================
          # 22. CREAR gradlew.bat
          # ============================================
          cat > gradlew.bat << 'EOF'
          @rem Gradle startup script for Windows
          @if "%OS%"=="Windows_NT" setlocal
          set APP_HOME=%CD%
          set CLASSPATH=%APP_HOME%\gradle\wrapper\gradle-wrapper.jar
          java -cp "%CLASSPATH%" org.gradle.wrapper.GradleWrapperMain %*
          EOF
          
          echo "✅ Proyecto Android creado completamente!"
          echo ""
          echo "📁 Archivos de recursos creados:"
          find app/src/main/res -name "*.xml" -o -name "*.png" | head -20

      - name: Validate Gradle Wrapper
        uses: gradle/wrapper-validation-action@v1

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.2'
          build-root-directory: android-app

      - name: Build Debug APK
        run: |
          cd android-app
          ./gradlew assembleDebug --no-daemon

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: android-app/app/build/outputs/apk/debug/*.apk

      - name: Build Release APK
        run: |
          cd android-app
          ./gradlew assembleRelease --no-daemon

      - name: Upload Release APK (unsigned)
        uses: actions/upload-artifact@v4
        with:
          name: app-release-unsigned
          path: android-app/app/build/outputs/apk/release/*.apk

      - name: Check signing secrets
        id: check_secrets
        run: |
          if [ -n "${{ secrets.KEYSTORE_BASE64 }}" ] && \
             [ -n "${{ secrets.KEYSTORE_PASSWORD }}" ] && \
             [ -n "${{ secrets.KEY_ALIAS }}" ] && \
             [ -n "${{ secrets.KEY_PASSWORD }}" ]; then
            echo "has_secrets=true" >> $GITHUB_OUTPUT
            echo "✅ Secrets de firma encontrados"
          else
            echo "has_secrets=false" >> $GITHUB_OUTPUT
            echo "⚠️ Secrets de firma NO configurados"
          fi

      - name: Sign Release APK
        if: github.ref == 'refs/heads/main' && steps.check_secrets.outputs.has_secrets == 'true'
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > keystore.jks
          cd android-app
          ./gradlew assembleRelease \
            -Pandroid.injected.signing.store.file=$(pwd)/../keystore.jks \
            -Pandroid.injected.signing.store.password=${{ secrets.KEYSTORE_PASSWORD }} \
            -Pandroid.injected.signing.key.alias=${{ secrets.KEY_ALIAS }} \
            -Pandroid.injected.signing.key.password=${{ secrets.KEY_PASSWORD }}

      - name: Upload Signed APK
        if: github.ref == 'refs/heads/main' && steps.check_secrets.outputs.has_secrets == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: app-release-signed
          path: android-app/app/build/outputs/apk/release/*.apk

      - name: Notify success
        if: success()
        run: |
          echo "✅ APK compilados exitosamente!"
          echo "📱 Descarga los APKs desde los artifacts"
