          if git diff --staged --quiet; then
            echo "✅ No hay cambios nuevos en android-app/"
          else
            git commit -m "🚀 Production Android app v4.0 - Fixed ic_store.xml [skip ci]"
            git push
            echo "✅ Archivos subidos al repositorio"
          fi

      - name: Build Debug APK
        run: |
          cd android-app
          ./gradlew assembleDebug --no-daemon

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: android-app/app/build/outputs/apk/debug/*.apk

      - name: Build Release APK
        run: |
          cd android-app
          ./gradlew assembleRelease --no-daemon

      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: android-app/app/build/outputs/apk/release/*.apk

