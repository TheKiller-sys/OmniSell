name: Build Android App (Production)

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    permissions:
      contents: write
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Create Production Android Project
        run: |
          echo "🚀 Creando proyecto Android para PRODUCCIÓN..."
          
          mkdir -p android-app/app/src/main/java/com/omniventas/app
          mkdir -p android-app/app/src/main/java/com/omniventas/app/api
          mkdir -p android-app/app/src/main/java/com/omniventas/app/models
          mkdir -p android-app/app/src/main/java/com/omniventas/app/ui
          mkdir -p android-app/app/src/main/java/com/omniventas/app/utils
          mkdir -p android-app/app/src/main/res/layout
          mkdir -p android-app/app/src/main/res/values
          mkdir -p android-app/app/src/main/res/drawable
          mkdir -p android-app/app/src/main/res/drawable-v24
          mkdir -p android-app/app/src/main/res/menu
          mkdir -p android-app/app/src/main/res/xml
          mkdir -p android-app/app/src/main/res/mipmap-hdpi
          mkdir -p android-app/app/src/main/res/mipmap-mdpi
          mkdir -p android-app/app/src/main/res/mipmap-xhdpi
          mkdir -p android-app/app/src/main/res/mipmap-xxhdpi
          mkdir -p android-app/app/src/main/res/mipmap-xxxhdpi
          mkdir -p android-app/app/src/main/res/mipmap-anydpi-v26
          mkdir -p android-app/app/src/main/res/anim
          mkdir -p android-app/gradle/wrapper
          
          cd android-app

      - name: Create gradle wrapper
        run: |
          cd android-app
          echo "distributionBase=GRADLE_USER_HOME" > gradle/wrapper/gradle-wrapper.properties
          echo "distributionPath=wrapper/dists" >> gradle/wrapper/gradle-wrapper.properties
          echo "distributionUrl=https://services.gradle.org/distributions/gradle-8.2-bin.zip" >> gradle/wrapper/gradle-wrapper.properties
          echo "zipStoreBase=GRADLE_USER_HOME" >> gradle/wrapper/gradle-wrapper.properties
          echo "zipStorePath=wrapper/dists" >> gradle/wrapper/gradle-wrapper.properties
          
          curl -L -o gradle/wrapper/gradle-wrapper.jar \
            https://raw.githubusercontent.com/gradle/gradle/v8.2.0/gradle/wrapper/gradle-wrapper.jar
          
          cat > gradlew << 'EOF'
          #!/bin/sh
          APP_HOME=$(cd "$(dirname "$0")" && pwd)
          CLASSPATH=$APP_HOME/gradle/wrapper/gradle-wrapper.jar
          exec java -cp "$CLASSPATH" org.gradle.wrapper.GradleWrapperMain "$@"
          EOF
          chmod +x gradlew

      - name: Create gradle files
        run: |
          cd android-app
          
          cat > gradle.properties << 'EOF'
          android.useAndroidX=true
          android.enableJetifier=true
          org.gradle.jvmargs=-Xmx2048m -XX:MaxMetaspaceSize=512m
          org.gradle.parallel=true
          org.gradle.caching=true
          EOF
          
          cat > settings.gradle << 'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "OmniVentas"
          include ':app'
          EOF
          
          cat > build.gradle << 'EOF'
          plugins {
              id 'com.android.application' version '8.2.0' apply false
          }
          EOF

      - name: Create app build.gradle
        run: |
          cd android-app
          cat > app/build.gradle << 'EOF'
          plugins {
              id 'com.android.application'
          }
          
          android {
              namespace 'com.omniventas.app'
              compileSdk 34
          
              defaultConfig {
                  applicationId "com.omniventas.app"
                  minSdk 21
                  targetSdk 34
                  versionCode 2
                  versionName "2.0.0"
                  testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
              }
          
              buildTypes {
                  release {
                      minifyEnabled true
                      proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
                  }
                  debug {
                      minifyEnabled false
                      debuggable true
                  }
              }
          
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_1_8
                  targetCompatibility JavaVersion.VERSION_1_8
              }
          }
          
          dependencies {
              implementation 'androidx.appcompat:appcompat:1.6.1'
              implementation 'com.google.android.material:material:1.10.0'
              implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
              implementation 'androidx.recyclerview:recyclerview:1.3.2'
              implementation 'androidx.cardview:cardview:1.0.0'
              implementation 'androidx.swiperefreshlayout:swiperefreshlayout:1.1.0'
              implementation 'androidx.security:security-crypto:1.1.0-alpha06'
              implementation 'com.squareup.retrofit2:retrofit:2.9.0'
              implementation 'com.squareup.retrofit2:converter-gson:2.9.0'
              implementation 'com.squareup.okhttp3:logging-interceptor:4.11.0'
              implementation 'com.auth0:java-jwt:4.4.0'
              implementation 'com.google.code.gson:gson:2.10.1'
              implementation 'com.github.bumptech.glide:glide:4.16.0'
              testImplementation 'junit:junit:4.13.2'
              androidTestImplementation 'androidx.test.ext:junit:1.1.5'
              androidTestImplementation 'androidx.test.espresso:espresso-core:3.5.1'
          }
          EOF
          
          cat > app/proguard-rules.pro << 'EOF'
          -keep class com.omniventas.app.** { *; }
          -keep class retrofit2.** { *; }
          -keep class okhttp3.** { *; }
          -keep class com.google.gson.** { *; }
          -dontwarn okhttp3.**
          -dontwarn retrofit2.**
          EOF

      - name: Create AndroidManifest
        run: |
          cd android-app
          cat > app/src/main/AndroidManifest.xml << 'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android"
              xmlns:tools="http://schemas.android.com/tools">
          
              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />
              <uses-permission android:name="android.permission.ACCESS_WIFI_STATE" />
          
              <application
                  android:allowBackup="true"
                  android:icon="@mipmap/ic_launcher"
                  android:label="@string/app_name"
                  android:roundIcon="@mipmap/ic_launcher_round"
                  android:supportsRtl="true"
                  android:theme="@style/Theme.OmniVentas"
                  android:usesCleartextTraffic="true"
                  android:networkSecurityConfig="@xml/network_security_config"
                  android:hardwareAccelerated="true"
                  tools:targetApi="31">
          
                  <activity
                      android:name=".LoginActivity"
                      android:exported="true"
                      android:screenOrientation="portrait"
                      android:windowSoftInputMode="adjustResize"
                      android:theme="@style/Theme.OmniVentas.Login">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
          
                  <activity
                      android:name=".MainActivity"
                      android:exported="false"
                      android:screenOrientation="portrait"
                      android:windowSoftInputMode="adjustResize" />
          
              </application>
          
          </manifest>
          EOF

      - name: Create network security config
        run: |
          cd android-app
          cat > app/src/main/res/xml/network_security_config.xml << 'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <network-security-config>
              <domain-config cleartextTrafficPermitted="true">
                  <domain includeSubdomains="true">10.0.2.2</domain>
                  <domain includeSubdomains="true">localhost</domain>
                  <domain includeSubdomains="true">prueba-1-omni.onrender.com</domain>
                  <domain includeSubdomains="true">onrender.com</domain>
              </domain-config>
          </network-security-config>
          EOF

      - name: Create animation files
        run: |
          cd android-app
          
          cat > app/src/main/res/anim/fade_in.xml << 'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <alpha xmlns:android="http://schemas.android.com/apk/res/android"
              android:fromAlpha="0.0"
              android:toAlpha="1.0"
              android:duration="600" />
          EOF
          
          cat > app/src/main/res/anim/slide_up.xml << 'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <translate xmlns:android="http://schemas.android.com/apk/res/android"
              android:fromYDelta="100%"
              android:toYDelta="0%"
              android:duration="600" />
          EOF
          
          cat > app/src/main/res/anim/scale_up.xml << 'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <scale xmlns:android="http://schemas.android.com/apk/res/android"
              android:fromXScale="0.8"
              android:toXScale="1.0"
              android:fromYScale="0.8"
              android:toYScale="1.0"
              android:pivotX="50%"
              android:pivotY="50%"
              android:duration="400" />
          EOF

      - name: Create colors
        run: |
          cd android-app
          cat > app/src/main/res/values/colors.xml << 'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <color name="primary">#6366F1</color>
              <color name="primary_dark">#4F46E5</color>
              <color name="primary_light">#818CF8</color>
              <color name="primary_gradient_start">#6366F1</color>
              <color name="primary_gradient_end">#8B5CF6</color>
              <color name="secondary">#8B5CF6</color>
              <color name="secondary_light">#A78BFA</color>
              <color name="success">#10B981</color>
              <color name="warning">#F59E0B</color>
              <color name="danger">#EF4444</color>
              <color name="info">#3B82F6</color>
              <color name="dark">#1F2937</color>
              <color name="dark_secondary">#374151</color>
              <color name="gray">#6B7280</color>
              <color name="gray_light">#E5E7EB</color>
              <color name="light_gray">#F3F4F6</color>
              <color name="white">#FFFFFF</color>
              <color name="white_alpha_80">#CCFFFFFF</color>
              <color name="bottom_nav_tint">@color/primary</color>
              <color name="bottom_nav_background">@color/white</color>
              <color name="card_ventas_hoy">#EEF2FF</color>
              <color name="card_ingresos_hoy">#ECFDF5</color>
              <color name="card_ventas_mes">#EFF6FF</color>
              <color name="card_ingresos_mes">#FEF3C7</color>
          </resources>
          EOF

      - name: Create strings
        run: |
          cd android-app
          cat > app/src/main/res/values/strings.xml << 'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <string name="app_name">OmniVentas</string>
              <string name="login_title">OmniVentas</string>
              <string name="login_subtitle">Acceso para Vendedores</string>
              <string name="login_hint">ID de Vendedor</string>
              <string name="login_button">Ingresar</string>
              <string name="login_help">Contacta al administrador para obtener tu ID</string>
              <string name="login_error_empty">Ingresa tu ID de vendedor</string>
              <string name="login_error_length">El ID debe tener 8 caracteres</string>
              <string name="login_error_chars">Solo letras y números</string>
          </resources>
          EOF

      - name: Create themes
        run: |
          cd android-app
          cat > app/src/main/res/values/themes.xml << 'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <style name="Theme.OmniVentas" parent="Theme.MaterialComponents.DayNight.NoActionBar">
                  <item name="colorPrimary">@color/primary</item>
                  <item name="colorPrimaryVariant">@color/primary_dark</item>
                  <item name="colorOnPrimary">@color/white</item>
                  <item name="colorSecondary">@color/secondary</item>
                  <item name="colorOnSecondary">@color/white</item>
                  <item name="android:statusBarColor">@color/primary_dark</item>
                  <item name="android:windowBackground">@color/light_gray</item>
                  <item name="android:windowAnimationStyle">@style/WindowAnimationTransition</item>
              </style>
          
              <style name="Theme.OmniVentas.Login" parent="Theme.OmniVentas">
                  <item name="android:statusBarColor">@color/primary_dark</item>
                  <item name="android:windowBackground">@color/white</item>
              </style>
          
              <style name="WindowAnimationTransition">
                  <item name="android:windowEnterAnimation">@anim/fade_in</item>
                  <item name="android:windowExitAnimation">@anim/fade_in</item>
              </style>
          
              <style name="CardViewStyle" parent="CardView">
                  <item name="cardCornerRadius">16dp</item>
                  <item name="cardElevation">8dp</item>
                  <item name="cardBackgroundColor">@color/white</item>
              </style>
          
              <style name="StatCardStyle" parent="CardViewStyle">
                  <item name="cardCornerRadius">16dp</item>
                  <item name="cardElevation">4dp</item>
              </style>
          </resources>
          EOF

      - name: Create drawables - Login
        run: |
          cd android-app
          
          cat > app/src/main/res/drawable/bg_login_gradient.xml << 'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <shape xmlns:android="http://schemas.android.com/apk/res/android">
              <gradient
                  android:startColor="@color/primary_gradient_start"
                  android:endColor="@color/primary_gradient_end"
                  android:angle="135" />
          </shape>
          EOF
          
          cat > app/src/main/res/drawable/bg_card_login.xml << 'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <shape xmlns:android="http://schemas.android.com/apk/res/android">
              <solid android:color="@color/white" />
              <corners android:radius="24dp" />
              <stroke android:width="1dp" android:color="@color/gray_light" />
          </shape>
          EOF
          
          cat > app/src/main/res/drawable/bg_button_login.xml << 'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <shape xmlns:android="http://schemas.android.com/apk/res/android">
              <gradient
                  android:startColor="@color/primary_gradient_start"
                  android:endColor="@color/primary_gradient_end"
                  android:angle="45" />
              <corners android:radius="16dp" />
          </shape>
          EOF
          
          cat > app/src/main/res/drawable/bg_input_login.xml << 'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <shape xmlns:android="http://schemas.android.com/apk/res/android">
              <solid android:color="@color/light_gray" />
              <corners android:radius="16dp" />
              <stroke android:width="2dp" android:color="@color/gray_light" />
          </shape>
          EOF
          
          cat > app/src/main/res/drawable/bg_input_login_focused.xml << 'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <shape xmlns:android="http://schemas.android.com/apk/res/android">
              <solid android:color="@color/light_gray" />
              <corners android:radius="16dp" />
              <stroke android:width="2dp" android:color="@color/primary" />
          </shape>
          EOF
          
          cat > app/src/main/res/drawable/bg_error.xml << 'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <shape xmlns:android="http://schemas.android.com/apk/res/android">
              <solid android:color="#FEE2E2" />
              <corners android:radius="12dp" />
              <stroke android:width="1dp" android:color="@color/danger" />
          </shape>
          EOF

      - name: Create drawables - Icons
        run: |
          cd android-app
          
          cat > app/src/main/res/drawable/ic_launcher_foreground.xml << 'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="108dp"
              android:height="108dp"
              android:viewportWidth="108"
              android:viewportHeight="108">
              <path
                  android:fillColor="#6366F1"
                  android:pathData="M54,27C40.5,27 30,37.5 30,51C30,64.5 40.5,75 54,75C67.5,75 78,64.5 78,51C78,37.5 67.5,27 54,27ZM54,69C44.1,69 36,60.9 36,51C36,41.1 44.1,33 54,33C63.9,33 72,41.1 72,51C72,60.9 63.9,69 54,69ZM54,39C47.4,39 42,44.4 42,51C42,57.6 47.4,63 54,63C60.6,63 66,57.6 66,51C66,44.4 60.6,39 54,39Z"/>
              <path
                  android:fillColor="#FFFFFF"
                  android:pathData="M54,45C50.7,45 48,47.7 48,51C48,54.3 50.7,57 54,57C57.3,57 60,54.3 60,51C60,47.7 57.3,45 54,45Z"/>
          </vector>
          EOF
          
          cat > app/src/main/res/drawable/ic_vendor.xml << 'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="80dp"
              android:height="80dp"
              android:viewportWidth="24"
              android:viewportHeight="24">
              <path
                  android:fillColor="@color/primary"
                  android:pathData="M12,12c2.21,0 4,-1.79 4,-4s-1.79,-4 -4,-4 -4,1.79 -4,4 1.79,4 4,4zM12,14c-2.67,0 -8,1.34 -8,4v2h16v-2c0,-2.66 -5.33,-4 -8,-4z"/>
              <path
                  android:fillColor="@color/white"
                  android:pathData="M12,12c-0.83,0 -1.5,-0.67 -1.5,-1.5S11.17,9 12,9s1.5,0.67 1.5,1.5S12.83,12 12,12zM12,10c-0.28,0 -0.5,0.22 -0.5,0.5S11.72,11 12,11s0.5,-0.22 0.5,-0.5S12.28,10 12,10z"/>
          </vector>
          EOF
          
          cat > app/src/main/res/drawable/ic_vendor_id.xml << 'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="24dp"
              android:height="24dp"
              android:viewportWidth="24"
              android:viewportHeight="24">
              <path
                  android:fillColor="@color/gray"
                  android:pathData="M20,4H4c-1.1,0 -2,0.9 -2,2v12c0,1.1 0.9,2 2,2h16c1.1,0 2,-0.9 2,-2V6c0,-1.1 -0.9,-2 -2,-2zM4,6h16v2H4V6zM4,12v-2h4v2H4zM4,10V8h4v2H4zM12,12H8v-2h4v2zM12,10H8V8h4v2zM20,12h-6v-2h6v2zM20,10h-6V8h6v2zM4,16v-2h16v2H4z"/>
          </vector>
          EOF
          
          cat > app/src/main/res/drawable/ic_store.xml << 'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="24dp"
              android:height="24dp"
              android:viewportWidth="24"
              android:viewportHeight="24">
              <path
                  android:fillColor="@color/primary"
                  android:pathData="M20,4H4c-1.1,0 -2,0.9 -2,2v12c0,1.1 0.9,2 2,2h16c1.1,0 2,-0.9 2,-2V6c0,-1.1 -0.9,-2 -2,-2zM4,6h16v2H4V6zM4,12h4v2H4v-2zM10,12h4v2h-4v-2zM16,12h4v2h-4v-2zM4,10V8h4v2H4zM10,10V8h4v2h-4zM16,10V8h4v2h-4z"/>
          </vector>
          EOF

      - name: Create Bottom Nav Icons
        run: |
          cd android-app
          
          cat > app/src/main/res/drawable/ic_dashboard.xml << 'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="24dp"
              android:height="24dp"
              android:viewportWidth="24"
              android:viewportHeight="24">
              <path
                  android:fillColor="#000000"
                  android:pathData="M3,13h8L11,3L3,3v10zM3,21h8v-6L3,15v6zM13,21h8L21,11h-8v10zM13,3v6h8L21,3h-8z"/>
          </vector>
          EOF
          
          cat > app/src/main/res/drawable/ic_ventas.xml << 'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="24dp"
              android:height="24dp"
              android:viewportWidth="24"
              android:viewportHeight="24">
              <path
                  android:fillColor="#000000"
                  android:pathData="M7,18c-1.1,0 -2,0.9 -2,2s0.9,2 2,2 2,-0.9 2,-2 -0.9,-2 -2,-2zM1,2v2h2l3.6,7.59 -1.35,2.45C5.16,14.9 5.78,16 7,16h12v-2L7,14l1.1,-2h7.45c0.75,0 1.41,-0.41 1.75,-1.03l3.58,-6.49A1.996,1.996 0,0 0,20.01 4L5.21,4l-0.94,-2L1,2zM17,18c-1.1,0 -2,0.9 -2,2s0.9,2 2,2 2,-0.9 2,-2 -0.9,-2 -2,-2z"/>
          </vector>
          EOF
          
          cat > app/src/main/res/drawable/ic_inventario.xml << 'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="24dp"
              android:height="24dp"
              android:viewportWidth="24"
              android:viewportHeight="24">
              <path
                  android:fillColor="#000000"
                  android:pathData="M20,6h-4V4c0,-1.1 -0.9,-2 -2,-2h-4C8.9,2 8,2.9 8,4v2H4c-1.1,0 -2,0.9 -2,2v12c0,1.1 0.9,2 2,2h16c1.1,0 2,-0.9 2,-2V8c0,-1.1 -0.9,-2 -2,-2zM10,4h4v2h-4V4zM4,20V8h4v10h8V8h4v12H4z"/>
          </vector>
          EOF
          
          cat > app/src/main/res/drawable/ic_logout.xml << 'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="24dp"
              android:height="24dp"
              android:viewportWidth="24"
              android:viewportHeight="24">
              <path
                  android:fillColor="#000000"
                  android:pathData="M17,7l-1.41,1.41L18.17,11H8v2h10.17l-2.58,2.58L17,17l5,-5zM4,5h8V3H4c-1.1,0 -2,0.9 -2,2v14c0,1.1 0.9,2 2,2h8v-2H4V5z"/>
          </vector>
          EOF

      - name: Create menu
        run: |
          cd android-app
          cat > app/src/main/res/menu/bottom_nav_menu.xml << 'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <menu xmlns:android="http://schemas.android.com/apk/res/android">
              <item
                  android:id="@+id/nav_dashboard"
                  android:icon="@drawable/ic_dashboard"
                  android:title="Dashboard" />
              <item
                  android:id="@+id/nav_ventas"
                  android:icon="@drawable/ic_ventas"
                  android:title="Ventas" />
              <item
                  android:id="@+id/nav_inventario"
                  android:icon="@drawable/ic_inventario"
                  android:title="Inventario" />
              <item
                  android:id="@+id/nav_logout"
                  android:icon="@drawable/ic_logout"
