name: Build Android APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      # ============================================
      # CREAR PROYECTO ANDROID COMPLETO CON TODOS LOS RECURSOS
      # ============================================
      - name: Create full Android project with all resources
        run: |
          echo "📱 Creando proyecto Android completo con todos los recursos..."
          
          # Crear estructura de directorios
          mkdir -p android-app/app/src/main/java/com/omniventas/app
          mkdir -p android-app/app/src/main/java/com/omniventas/app/api
          mkdir -p android-app/app/src/main/java/com/omniventas/app/models
          mkdir -p android-app/app/src/main/java/com/omniventas/app/ui
          mkdir -p android-app/app/src/main/java/com/omniventas/app/utils
          mkdir -p android-app/app/src/main/res/layout
          mkdir -p android-app/app/src/main/res/values
          mkdir -p android-app/app/src/main/res/drawable
          mkdir -p android-app/app/src/main/res/menu
          mkdir -p android-app/app/src/main/res/mipmap-hdpi
          mkdir -p android-app/app/src/main/res/mipmap-mdpi
          mkdir -p android-app/app/src/main/res/mipmap-xhdpi
          mkdir -p android-app/app/src/main/res/mipmap-xxhdpi
          mkdir -p android-app/app/src/main/res/mipmap-xxxhdpi
          mkdir -p android-app/app/src/main/res/mipmap-anydpi-v26
          mkdir -p android-app/gradle/wrapper
          
          cd android-app
          
          # ============================================
          # GRADLE WRAPPER
          # ============================================
          printf '%s\n' \
            "distributionBase=GRADLE_USER_HOME" \
            "distributionPath=wrapper/dists" \
            "distributionUrl=https\://services.gradle.org/distributions/gradle-8.2-bin.zip" \
            "zipStoreBase=GRADLE_USER_HOME" \
            "zipStorePath=wrapper/dists" \
            > gradle/wrapper/gradle-wrapper.properties
          
          curl -L -o gradle/wrapper/gradle-wrapper.jar \
            https://raw.githubusercontent.com/gradle/gradle/v8.2.0/gradle/wrapper/gradle-wrapper.jar
          
          printf '%s\n' \
            '#!/bin/sh' \
            'APP_HOME=$(cd "$(dirname "$0")" && pwd)' \
            'CLASSPATH=$APP_HOME/gradle/wrapper/gradle-wrapper.jar' \
            'exec java -cp "$CLASSPATH" org.gradle.wrapper.GradleWrapperMain "$@"' \
            > gradlew
          chmod +x gradlew
          
          # ============================================
          # GRADLE PROPERTIES
          # ============================================
          printf '%s\n' \
            "android.useAndroidX=true" \
            "android.enableJetifier=true" \
            "org.gradle.jvmargs=-Xmx2048m -XX:MaxMetaspaceSize=512m" \
            "org.gradle.parallel=true" \
            "org.gradle.caching=true" \
            > gradle.properties
          
          # ============================================
          # SETTINGS.GRADLE
          # ============================================
          printf '%s\n' \
            "pluginManagement {" \
            "    repositories {" \
            "        google()" \
            "        mavenCentral()" \
            "        gradlePluginPortal()" \
            "    }" \
            "}" \
            "dependencyResolutionManagement {" \
            "    repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)" \
            "    repositories {" \
            "        google()" \
            "        mavenCentral()" \
            "    }" \
            "}" \
            "rootProject.name = \"OmniVentas\"" \
            "include ':app'" \
            > settings.gradle
          
          # ============================================
          # BUILD.GRADLE (proyecto)
          # ============================================
          printf '%s\n' \
            "plugins {" \
            "    id 'com.android.application' version '8.2.0' apply false" \
            "}" \
            > build.gradle
          
          # ============================================
          # BUILD.GRADLE (app) - CON TODAS LAS DEPENDENCIAS
          # ============================================
          printf '%s\n' \
            "plugins {" \
            "    id 'com.android.application'" \
            "}" \
            "" \
            "android {" \
            "    namespace 'com.omniventas.app'" \
            "    compileSdk 34" \
            "" \
            "    defaultConfig {" \
            "        applicationId \"com.omniventas.app\"" \
            "        minSdk 21" \
            "        targetSdk 34" \
            "        versionCode 1" \
            "        versionName \"1.0\"" \
            "        testInstrumentationRunner \"androidx.test.runner.AndroidJUnitRunner\"" \
            "    }" \
            "" \
            "    buildTypes {" \
            "        release {" \
            "            minifyEnabled false" \
            "            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'" \
            "        }" \
            "        debug {" \
            "            minifyEnabled false" \
            "        }" \
            "    }" \
            "" \
            "    compileOptions {" \
            "        sourceCompatibility JavaVersion.VERSION_1_8" \
            "        targetCompatibility JavaVersion.VERSION_1_8" \
            "    }" \
            "}" \
            "" \
            "dependencies {" \
            "    implementation 'androidx.appcompat:appcompat:1.6.1'" \
            "    implementation 'com.google.android.material:material:1.10.0'" \
            "    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'" \
            "    implementation 'androidx.recyclerview:recyclerview:1.3.2'" \
            "    implementation 'androidx.cardview:cardview:1.0.0'" \
            "    implementation 'androidx.swiperefreshlayout:swiperefreshlayout:1.1.0'" \
            "" \
            "    implementation 'com.squareup.retrofit2:retrofit:2.9.0'" \
            "    implementation 'com.squareup.retrofit2:converter-gson:2.9.0'" \
            "    implementation 'com.squareup.okhttp3:logging-interceptor:4.11.0'" \
            "" \
            "    implementation 'com.auth0:java-jwt:4.4.0'" \
            "" \
            "    implementation 'androidx.security:security-crypto:1.1.0-alpha06'" \
            "" \
            "    testImplementation 'junit:junit:4.13.2'" \
            "    androidTestImplementation 'androidx.test.ext:junit:1.1.5'" \
            "    androidTestImplementation 'androidx.test.espresso:espresso-core:3.5.1'" \
            "}" \
            > app/build.gradle
          
          # ============================================
          # PROGUARD
          # ============================================
          printf '%s\n' \
            "# Add project specific ProGuard rules here." \
            "-keep class com.omniventas.app.** { *; }" \
            > app/proguard-rules.pro
          
          # ============================================
          # ANDROID MANIFEST
          # ============================================
          printf '%s\n' \
            "<?xml version=\"1.0\" encoding=\"utf-8\"?>" \
            "<manifest xmlns:android=\"http://schemas.android.com/apk/res/android\"" \
            "    xmlns:tools=\"http://schemas.android.com/tools\">" \
            "" \
            "    <uses-permission android:name=\"android.permission.INTERNET\" />" \
            "    <uses-permission android:name=\"android.permission.ACCESS_NETWORK_STATE\" />" \
            "" \
            "    <application" \
            "        android:allowBackup=\"true\"" \
            "        android:icon=\"@mipmap/ic_launcher\"" \
            "        android:label=\"@string/app_name\"" \
            "        android:roundIcon=\"@mipmap/ic_launcher_round\"" \
            "        android:supportsRtl=\"true\"" \
            "        android:theme=\"@style/Theme.OmniVentas\"" \
            "        android:usesCleartextTraffic=\"true\"" \
            "        tools:targetApi=\"31\">" \
            "" \
            "        <activity" \
            "            android:name=\".LoginActivity\"" \
            "            android:exported=\"true\"" \
            "            android:screenOrientation=\"portrait\">" \
            "            <intent-filter>" \
            "                <action android:name=\"android.intent.action.MAIN\" />" \
            "                <category android:name=\"android.intent.category.LAUNCHER\" />" \
            "            </intent-filter>" \
            "        </activity>" \
            "" \
            "        <activity" \
            "            android:name=\".MainActivity\"" \
            "            android:exported=\"false\"" \
            "            android:screenOrientation=\"portrait\" />" \
            "" \
            "    </application>" \
            "" \
            "</manifest>" \
            > app/src/main/AndroidManifest.xml
          
          # ============================================
          # COLORS.XML - ¡TODOS LOS COLORES DE OMNI VENTAS!
          # ============================================
          printf '%s\n' \
            "<?xml version=\"1.0\" encoding=\"utf-8\"?>" \
            "<resources>" \
            "    <color name=\"primary\">#4361EE</color>" \
            "    <color name=\"primary_dark\">#3A56D4</color>" \
            "    <color name=\"secondary\">#3F37C9</color>" \
            "    <color name=\"success\">#4CC9F0</color>" \
            "    <color name=\"warning\">#FFD166</color>" \
            "    <color name=\"danger\">#EF476F</color>" \
            "    <color name=\"dark\">#212529</color>" \
            "    <color name=\"light_gray\">#F5F7FB</color>" \
            "    <color name=\"gray\">#6C757D</color>" \
            "    <color name=\"white\">#FFFFFF</color>" \
            "    <color name=\"bottom_nav_tint\">@color/primary</color>" \
            "</resources>" \
            > app/src/main/res/values/colors.xml
          
          # ============================================
          # STRINGS.XML
          # ============================================
          printf '%s\n' \
            "<?xml version=\"1.0\" encoding=\"utf-8\"?>" \
            "<resources>" \
            "    <string name=\"app_name\">OmniVentas</string>" \
            "</resources>" \
            > app/src/main/res/values/strings.xml
          
          # ============================================
          # THEMES.XML
          # ============================================
          printf '%s\n' \
            "<?xml version=\"1.0\" encoding=\"utf-8\"?>" \
            "<resources>" \
            "    <style name=\"Theme.OmniVentas\" parent=\"Theme.MaterialComponents.DayNight.NoActionBar\">" \
            "        <item name=\"colorPrimary\">@color/primary</item>" \
            "        <item name=\"colorPrimaryVariant\">@color/primary_dark</item>" \
            "        <item name=\"colorOnPrimary\">@color/white</item>" \
            "        <item name=\"colorSecondary\">@color/secondary</item>" \
            "        <item name=\"colorOnSecondary\">@color/white</item>" \
            "        <item name=\"android:statusBarColor\">@color/primary</item>" \
            "    </style>" \
            "</resources>" \
            > app/src/main/res/values/themes.xml
          
          # ============================================
          # EDIT_TEXT_BACKGROUND.XML
          # ============================================
          printf '%s\n' \
            "<?xml version=\"1.0\" encoding=\"utf-8\"?>" \
            "<shape xmlns:android=\"http://schemas.android.com/apk/res/android\">" \
            "    <solid android:color=\"@color/white\" />" \
            "    <stroke android:width=\"1dp\" android:color=\"@color/gray\" />" \
            "    <corners android:radius=\"8dp\" />" \
            "</shape>" \
            > app/src/main/res/drawable/edit_text_background.xml
          
          # ============================================
          # SPINNER_BACKGROUND.XML
          # ============================================
          printf '%s\n' \
            "<?xml version=\"1.0\" encoding=\"utf-8\"?>" \
            "<shape xmlns:android=\"http://schemas.android.com/apk/res/android\">" \
            "    <solid android:color=\"@color/white\" />" \
            "    <stroke android:width=\"1dp\" android:color=\"@color/gray\" />" \
            "    <corners android:radius=\"8dp\" />" \
            "</shape>" \
            > app/src/main/res/drawable/spinner_background.xml
          
          # ============================================
          # IC_LOGO.XML
          # ============================================
          printf '%s\n' \
            "<?xml version=\"1.0\" encoding=\"utf-8\"?>" \
            "<vector xmlns:android=\"http://schemas.android.com/apk/res/android\"" \
            "    android:width=\"24dp\"" \
            "    android:height=\"24dp\"" \
            "    android:viewportWidth=\"24\"" \
            "    android:viewportHeight=\"24\">" \
            "    <path" \
            "        android:fillColor=\"@color/primary\"" \
            "        android:pathData=\"M12,2C6.48,2 2,6.48 2,12s4.48,10 10,10 10,-4.48 10,-10S17.52,2 12,2zm-2,15l-5,-5 1.41,-1.41L10,14.17l7.59,-7.59L19,8l-9,9z\"/>" \
            "</vector>" \
            > app/src/main/res/drawable/ic_logo.xml
          
          # ============================================
          # ICONOS DEL MENÚ
          # ============================================
          # ic_dashboard
          printf '%s\n' \
            "<?xml version=\"1.0\" encoding=\"utf-8\"?>" \
            "<vector xmlns:android=\"http://schemas.android.com/apk/res/android\"" \
            "    android:width=\"24dp\"" \
            "    android:height=\"24dp\"" \
            "    android:viewportWidth=\"24\"" \
            "    android:viewportHeight=\"24\">" \
            "    <path" \
            "        android:fillColor=\"#000000\"" \
            "        android:pathData=\"M3,13h8L11,3L3,3v10zM3,21h8v-6L3,15v6zM13,21h8L21,11h-8v10zM13,3v6h8L21,3h-8z\"/>" \
            "</vector>" \
            > app/src/main/res/drawable/ic_dashboard.xml
          
          # ic_ventas
          printf '%s\n' \
            "<?xml version=\"1.0\" encoding=\"utf-8\"?>" \
            "<vector xmlns:android=\"http://schemas.android.com/apk/res/android\"" \
            "    android:width=\"24dp\"" \
            "    android:height=\"24dp\"" \
            "    android:viewportWidth=\"24\"" \
            "    android:viewportHeight=\"24\">" \
            "    <path" \
            "        android:fillColor=\"#000000\"" \
            "        android:pathData=\"M7,18c-1.1,0 -2,0.9 -2,2s0.9,2 2,2 2,-0.9 2,-2 -0.9,-2 -2,-2zM1,2v2h2l3.6,7.59 -1.35,2.45C5.16,14.9 5.78,16 7,16h12v-2L7,14l1.1,-2h7.45c0.75,0 1.41,-0.41 1.75,-1.03l3.58,-6.49A1.996,1.996 0,0 0,20.01 4L5.21,4l-0.94,-2L1,2zM17,18c-1.1,0 -2,0.9 -2,2s0.9,2 2,2 2,-0.9 2,-2 -0.9,-2 -2,-2z\"/>" \
            "</vector>" \
            > app/src/main/res/drawable/ic_ventas.xml
          
          # ic_inventario
          printf '%s\n' \
            "<?xml version=\"1.0\" encoding=\"utf-8\"?>" \
            "<vector xmlns:android=\"http://schemas.android.com/apk/res/android\"" \
            "    android:width=\"24dp\"" \
            "    android:height=\"24dp\"" \
            "    android:viewportWidth=\"24\"" \
            "    android:viewportHeight=\"24\">" \
            "    <path" \
            "        android:fillColor=\"#000000\"" \
            "        android:pathData=\"M20,6h-4V4c0,-1.1 -0.9,-2 -2,-2h-4C8.9,2 8,2.9 8,4v2H4c-1.1,0 -2,0.9 -2,2v12c0,1.1 0.9,2 2,2h16c1.1,0 2,-0.9 2,-2V8c0,-1.1 -0.9,-2 -2,-2zM10,4h4v2h-4V4zM4,20V8h4v10h8V8h4v12H4z\"/>" \
            "</vector>" \
            > app/src/main/res/drawable/ic_inventario.xml
          
          # ic_logout
          printf '%s\n' \
            "<?xml version=\"1.0\" encoding=\"utf-8\"?>" \
            "<vector xmlns:android=\"http://schemas.android.com/apk/res/android\"" \
            "    android:width=\"24dp\"" \
            "    android:height=\"24dp\"" \
            "    android:viewportWidth=\"24\"" \
            "    android:viewportHeight=\"24\">" \
            "    <path" \
            "        android:fillColor=\"#000000\"" \
            "        android:pathData=\"M17,7l-1.41,1.41L18.17,11H8v2h10.17l-2.58,2.58L17,17l5,-5zM4,5h8V3H4c-1.1,0 -2,0.9 -2,2v14c0,1.1 0.9,2 2,2h8v-2H4V5z\"/>" \
            "</vector>" \
            > app/src/main/res/drawable/ic_logout.xml
          
          # ============================================
          # BOTTOM NAV MENU
          # ============================================
          mkdir -p app/src/main/res/menu
          printf '%s\n' \
            "<?xml version=\"1.0\" encoding=\"utf-8\"?>" \
            "<menu xmlns:android=\"http://schemas.android.com/apk/res/android\">" \
            "    <item" \
            "        android:id=\"@+id/nav_dashboard\"" \
            "        android:icon=\"@drawable/ic_dashboard\"" \
            "        android:title=\"Dashboard\" />" \
            "    <item" \
            "        android:id=\"@+id/nav_ventas\"" \
            "        android:icon=\"@drawable/ic_ventas\"" \
            "        android:title=\"Ventas\" />" \
            "    <item" \
            "        android:id=\"@+id/nav_inventario\"" \
            "        android:icon=\"@drawable/ic_inventario\"" \
            "        android:title=\"Inventario\" />" \
            "    <item" \
            "        android:id=\"@+id/nav_logout\"" \
            "        android:icon=\"@drawable/ic_logout\"" \
            "        android:title=\"Salir\" />" \
            "</menu>" \
            > app/src/main/res/menu/bottom_nav_menu.xml
          
          # ============================================
          # ACTIVITY_LOGIN.XML
          # ============================================
          printf '%s\n' \
            "<?xml version=\"1.0\" encoding=\"utf-8\"?>" \
            "<LinearLayout xmlns:android=\"http://schemas.android.com/apk/res/android\"" \
            "    xmlns:app=\"http://schemas.android.com/apk/res-auto\"" \
            "    android:layout_width=\"match_parent\"" \
            "    android:layout_height=\"match_parent\"" \
            "    android:orientation=\"vertical\"" \
            "    android:padding=\"24dp\"" \
            "    android:gravity=\"center\"" \
            "    android:background=\"@color/white\">" \
            "" \
            "    <ImageView" \
            "        android:layout_width=\"80dp\"" \
            "        android:layout_height=\"80dp\"" \
            "        android:src=\"@drawable/ic_logo\"" \
            "        android:layout_marginBottom=\"16dp\" />" \
            "" \
            "    <TextView" \
            "        android:layout_width=\"wrap_content\"" \
            "        android:layout_height=\"wrap_content\"" \
            "        android:text=\"OmniVentas\"" \
            "        android:textSize=\"28sp\"" \
            "        android:textStyle=\"bold\"" \
            "        android:textColor=\"@color/primary\"" \
            "        android:layout_marginBottom=\"8dp\" />" \
            "" \
            "    <TextView" \
            "        android:layout_width=\"wrap_content\"" \
            "        android:layout_height=\"wrap_content\"" \
            "        android:text=\"Sistema de Gestión para Vendedores\"" \
            "        android:textSize=\"14sp\"" \
            "        android:textColor=\"@color/gray\"" \
            "        android:layout_marginBottom=\"32dp\" />" \
            "" \
            "    <EditText" \
            "        android:id=\"@+id/et_business_id\"" \
            "        android:layout_width=\"match_parent\"" \
            "        android:layout_height=\"wrap_content\"" \
            "        android:hint=\"ID del Negocio\"" \
            "        android:inputType=\"text\"" \
            "        android:padding=\"14dp\"" \
            "        android:background=\"@drawable/edit_text_background\"" \
            "        android:layout_marginBottom=\"12dp\" />" \
            "" \
            "    <EditText" \
            "        android:id=\"@+id/et_username\"" \
            "        android:layout_width=\"match_parent\"" \
            "        android:layout_height=\"wrap_content\"" \
            "        android:hint=\"Usuario\"" \
            "        android:inputType=\"text\"" \
            "        android:padding=\"14dp\"" \
            "        android:background=\"@drawable/edit_text_background\"" \
            "        android:layout_marginBottom=\"12dp\" />" \
            "" \
            "    <EditText" \
            "        android:id=\"@+id/et_password\"" \
            "        android:layout_width=\"match_parent\"" \
            "        android:layout_height=\"wrap_content\"" \
            "        android:hint=\"Contraseña\"" \
            "        android:inputType=\"textPassword\"" \
            "        android:padding=\"14dp\"" \
            "        android:background=\"@drawable/edit_text_background\"" \
            "        android:layout_marginBottom=\"24dp\" />" \
            "" \
            "    <Button" \
            "        android:id=\"@+id/btn_login\"" \
            "        android:layout_width=\"match_parent\"" \
            "        android:layout_height=\"wrap_content\"" \
            "        android:text=\"Iniciar Sesión\"" \
            "        android:textSize=\"16sp\"" \
            "        android:padding=\"14dp\"" \
            "        android:backgroundTint=\"@color/primary\"" \
            "        app:cornerRadius=\"12dp\" />" \
            "" \
            "</LinearLayout>" \
            > app/src/main/res/layout/activity_login.xml
          
          # ============================================
          # ACTIVITY_MAIN.XML
          # ============================================
          printf '%s\n' \
            "<?xml version=\"1.0\" encoding=\"utf-8\"?>" \
            "<LinearLayout xmlns:android=\"http://schemas.android.com/apk/res/android\"" \
            "    xmlns:app=\"http://schemas.android.com/apk/res-auto\"" \
            "    android:layout_width=\"match_parent\"" \
            "    android:layout_height=\"match_parent\"" \
            "    android:orientation=\"vertical\">" \
            "" \
            "    <FrameLayout" \
            "        android:id=\"@+id/fragment_container\"" \
            "        android:layout_width=\"match_parent\"" \
            "        android:layout_height=\"0dp\"" \
            "        android:layout_weight=\"1\" />" \
            "" \
            "    <com.google.android.material.bottomnavigation.BottomNavigationView" \
            "        android:id=\"@+id/bottom_navigation\"" \
            "        android:layout_width=\"match_parent\"" \
            "        android:layout_height=\"wrap_content\"" \
            "        android:background=\"@color/white\"" \
            "        app:menu=\"@menu/bottom_nav_menu\"" \
            "        app:itemIconTint=\"@color/bottom_nav_tint\"" \
            "        app:itemTextColor=\"@color/bottom_nav_tint\" />" \
            "" \
            "</LinearLayout>" \
            > app/src/main/res/layout/activity_main.xml
          
          # ============================================
          # FRAGMENT_DASHBOARD.XML
          # ============================================
          printf '%s\n' \
            "<?xml version=\"1.0\" encoding=\"utf-8\"?>" \
            "<LinearLayout xmlns:android=\"http://schemas.android.com/apk/res/android\"" \
            "    xmlns:app=\"http://schemas.android.com/apk/res-auto\"" \
            "    android:layout_width=\"match_parent\"" \
            "    android:layout_height=\"match_parent\"" \
            "    android:orientation=\"vertical\"" \
            "    android:padding=\"16dp\"" \
            "    android:background=\"@color/light_gray\">" \
            "" \
            "    <androidx.swiperefreshlayout.widget.SwipeRefreshLayout" \
            "        android:id=\"@+id/swipe_refresh\"" \
            "        android:layout_width=\"match_parent\"" \
            "        android:layout_height=\"match_parent\">" \
            "" \
            "        <ScrollView" \
            "            android:layout_width=\"match_parent\"" \
            "            android:layout_height=\"match_parent\">" \
            "" \
            "            <LinearLayout" \
            "                android:layout_width=\"match_parent\"" \
            "                android:layout_height=\"wrap_content\"" \
            "                android:orientation=\"vertical\">" \
            "" \
            "                <TextView" \
            "                    android:layout_width=\"match_parent\"" \
            "                    android:layout_height=\"wrap_content\"" \
            "                    android:text=\"📊 Dashboard\"" \
            "                    android:textSize=\"24sp\"" \
            "                    android:textStyle=\"bold\"" \
            "                    android:textColor=\"@color/dark\"" \
            "                    android:layout_marginBottom=\"16dp\" />" \
            "" \
            "                <LinearLayout" \
            "                    android:layout_width=\"match_parent\"" \
            "                    android:layout_height=\"wrap_content\"" \
            "                    android:orientation=\"horizontal\"" \
            "                    android:weightSum=\"2\"" \
            "                    android:layout_marginBottom=\"12dp\">" \
            "" \
            "                    <androidx.cardview.widget.CardView" \
            "                        android:layout_width=\"0dp\"" \
            "                        android:layout_height=\"wrap_content\"" \
            "                        android:layout_weight=\"1\"" \
