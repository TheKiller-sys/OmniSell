name: Build Android APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      # ============================================
      # CREAR PROYECTO ANDROID COMPLETO
      # ============================================
      - name: Create full Android project
        run: |
          echo "📱 Creando proyecto Android completo..."
          
          # Crear estructura de directorios
          mkdir -p android-app/app/src/main/java/com/omniventas/app
          mkdir -p android-app/app/src/main/res/layout
          mkdir -p android-app/app/src/main/res/values
          mkdir -p android-app/app/src/main/res/drawable
          mkdir -p android-app/app/src/main/res/menu
          mkdir -p android-app/app/src/main/res/mipmap-hdpi
          mkdir -p android-app/app/src/main/res/mipmap-mdpi
          mkdir -p android-app/app/src/main/res/mipmap-xhdpi
          mkdir -p android-app/app/src/main/res/mipmap-xxhdpi
          mkdir -p android-app/app/src/main/res/mipmap-xxxhdpi
          mkdir -p android-app/app/src/main/res/mipmap-anydpi-v26
          mkdir -p android-app/gradle/wrapper
          
          cd android-app
          
          # ============================================
          # 1. GRADLE WRAPPER
          # ============================================
          printf '%s\n' \
            "distributionBase=GRADLE_USER_HOME" \
            "distributionPath=wrapper/dists" \
            "distributionUrl=https\://services.gradle.org/distributions/gradle-8.2-bin.zip" \
            "zipStoreBase=GRADLE_USER_HOME" \
            "zipStorePath=wrapper/dists" \
            > gradle/wrapper/gradle-wrapper.properties
          
          curl -L -o gradle/wrapper/gradle-wrapper.jar \
            https://raw.githubusercontent.com/gradle/gradle/v8.2.0/gradle/wrapper/gradle-wrapper.jar
          
          printf '%s\n' \
            '#!/bin/sh' \
            'APP_HOME=$(cd "$(dirname "$0")" && pwd)' \
            'CLASSPATH=$APP_HOME/gradle/wrapper/gradle-wrapper.jar' \
            'exec java -cp "$CLASSPATH" org.gradle.wrapper.GradleWrapperMain "$@"' \
            > gradlew
          chmod +x gradlew
          
          # ============================================
          # 2. GRADLE PROPERTIES
          # ============================================
          printf '%s\n' \
            "android.useAndroidX=true" \
            "android.enableJetifier=true" \
            "org.gradle.jvmargs=-Xmx2048m -XX:MaxMetaspaceSize=512m" \
            "org.gradle.parallel=true" \
            "org.gradle.caching=true" \
            > gradle.properties
          
          # ============================================
          # 3. SETTINGS.GRADLE
          # ============================================
          printf '%s\n' \
            "pluginManagement {" \
            "    repositories {" \
            "        google()" \
            "        mavenCentral()" \
            "        gradlePluginPortal()" \
            "    }" \
            "}" \
            "dependencyResolutionManagement {" \
            "    repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)" \
            "    repositories {" \
            "        google()" \
            "        mavenCentral()" \
            "    }" \
            "}" \
            "rootProject.name = \"OmniVentas\"" \
            "include ':app'" \
            > settings.gradle
          
          # ============================================
          # 4. BUILD.GRADLE (proyecto)
          # ============================================
          printf '%s\n' \
            "plugins {" \
            "    id 'com.android.application' version '8.2.0' apply false" \
            "}" \
            > build.gradle
          
          # ============================================
          # 5. BUILD.GRADLE (app) - CON TODAS LAS DEPENDENCIAS
          # ============================================
          printf '%s\n' \
            "plugins {" \
            "    id 'com.android.application'" \
            "}" \
            "" \
            "android {" \
            "    namespace 'com.omniventas.app'" \
            "    compileSdk 34" \
            "" \
            "    defaultConfig {" \
            "        applicationId \"com.omniventas.app\"" \
            "        minSdk 21" \
            "        targetSdk 34" \
            "        versionCode 1" \
            "        versionName \"1.0\"" \
            "        testInstrumentationRunner \"androidx.test.runner.AndroidJUnitRunner\"" \
            "    }" \
            "" \
            "    buildTypes {" \
            "        release {" \
            "            minifyEnabled false" \
            "            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'" \
            "        }" \
            "        debug {" \
            "            minifyEnabled false" \
            "        }" \
            "    }" \
            "" \
            "    compileOptions {" \
            "        sourceCompatibility JavaVersion.VERSION_1_8" \
            "        targetCompatibility JavaVersion.VERSION_1_8" \
            "    }" \
            "}" \
            "" \
            "dependencies {" \
            "    implementation 'androidx.appcompat:appcompat:1.6.1'" \
            "    implementation 'com.google.android.material:material:1.10.0'" \
            "    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'" \
            "    implementation 'androidx.recyclerview:recyclerview:1.3.2'" \
            "    implementation 'androidx.cardview:cardview:1.0.0'" \
            "    implementation 'androidx.swiperefreshlayout:swiperefreshlayout:1.1.0'" \
            "" \
            "    implementation 'com.squareup.retrofit2:retrofit:2.9.0'" \
            "    implementation 'com.squareup.retrofit2:converter-gson:2.9.0'" \
            "    implementation 'com.squareup.okhttp3:logging-interceptor:4.11.0'" \
            "" \
            "    implementation 'com.auth0:java-jwt:4.4.0'" \
            "" \
            "    implementation 'androidx.security:security-crypto:1.1.0-alpha06'" \
            "" \
            "    testImplementation 'junit:junit:4.13.2'" \
            "    androidTestImplementation 'androidx.test.ext:junit:1.1.5'" \
            "    androidTestImplementation 'androidx.test.espresso:espresso-core:3.5.1'" \
            "}" \
            > app/build.gradle
          
          # ============================================
          # 6. PROGUARD
          # ============================================
          printf '%s\n' \
            "# Add project specific ProGuard rules here." \
            "-keep class com.omniventas.app.** { *; }" \
            > app/proguard-rules.pro
          
          # ============================================
          # 7. MANIFEST
          # ============================================
          printf '%s\n' \
            "<?xml version=\"1.0\" encoding=\"utf-8\"?>" \
            "<manifest xmlns:android=\"http://schemas.android.com/apk/res/android\">" \
            "" \
            "    <uses-permission android:name=\"android.permission.INTERNET\" />" \
            "    <uses-permission android:name=\"android.permission.ACCESS_NETWORK_STATE\" />" \
            "" \
            "    <application" \
            "        android:allowBackup=\"true\"" \
            "        android:icon=\"@mipmap/ic_launcher\"" \
            "        android:label=\"@string/app_name\"" \
            "        android:roundIcon=\"@mipmap/ic_launcher_round\"" \
            "        android:supportsRtl=\"true\"" \
            "        android:theme=\"@style/Theme.OmniVentas\"" \
            "        android:usesCleartextTraffic=\"true\">" \
            "" \
            "        <activity" \
            "            android:name=\".MainActivity\"" \
            "            android:exported=\"true\">" \
            "            <intent-filter>" \
            "                <action android:name=\"android.intent.action.MAIN\" />" \
            "                <category android:name=\"android.intent.category.LAUNCHER\" />" \
            "            </intent-filter>" \
            "        </activity>" \
            "" \
            "    </application>" \
            "" \
            "</manifest>" \
            > app/src/main/AndroidManifest.xml
          
          # ============================================
          # 8. MAIN ACTIVITY
          # ============================================
          printf '%s\n' \
            "package com.omniventas.app;" \
            "" \
            "import android.os.Bundle;" \
            "import android.widget.TextView;" \
            "import androidx.appcompat.app.AppCompatActivity;" \
            "" \
            "public class MainActivity extends AppCompatActivity {" \
            "    @Override" \
            "    protected void onCreate(Bundle savedInstanceState) {" \
            "        super.onCreate(savedInstanceState);" \
            "        setContentView(R.layout.activity_main);" \
            "        TextView textView = findViewById(R.id.textView);" \
            "        textView.setText(\"OmniVentas funcionando!\");" \
            "    }" \
            "}" \
            > app/src/main/java/com/omniventas/app/MainActivity.java
          
          # ============================================
          # 9. LAYOUT
          # ============================================
          printf '%s\n' \
            "<?xml version=\"1.0\" encoding=\"utf-8\"?>" \
            "<LinearLayout xmlns:android=\"http://schemas.android.com/apk/res/android\"" \
            "    android:layout_width=\"match_parent\"" \
            "    android:layout_height=\"match_parent\"" \
            "    android:orientation=\"vertical\"" \
            "    android:gravity=\"center\"" \
            "    android:padding=\"24dp\">" \
            "" \
            "    <TextView" \
            "        android:id=\"@+id/textView\"" \
            "        android:layout_width=\"wrap_content\"" \
            "        android:layout_height=\"wrap_content\"" \
            "        android:text=\"OmniVentas\"" \
            "        android:textSize=\"32sp\"" \
            "        android:textStyle=\"bold\"" \
            "        android:textColor=\"#4361EE\" />" \
            "" \
            "    <TextView" \
            "        android:layout_width=\"wrap_content\"" \
            "        android:layout_height=\"wrap_content\"" \
            "        android:text=\"Sistema de Gestión\"" \
            "        android:textSize=\"16sp\"" \
            "        android:textColor=\"#6C757D\"" \
            "        android:layout_marginTop=\"8dp\" />" \
            "" \
            "</LinearLayout>" \
            > app/src/main/res/layout/activity_main.xml
          
          # ============================================
          # 10. RECURSOS (strings, colors, themes)
          # ============================================
          printf '%s\n' \
            "<?xml version=\"1.0\" encoding=\"utf-8\"?>" \
            "<resources>" \
            "    <string name=\"app_name\">OmniVentas</string>" \
            "</resources>" \
            > app/src/main/res/values/strings.xml
          
          printf '%s\n' \
            "<?xml version=\"1.0\" encoding=\"utf-8\"?>" \
            "<resources>" \
            "    <color name=\"purple_200\">#FFBB86FC</color>" \
            "    <color name=\"purple_500\">#FF6200EE</color>" \
            "    <color name=\"purple_700\">#FF3700B3</color>" \
            "    <color name=\"teal_200\">#FF03DAC5</color>" \
            "    <color name=\"teal_700\">#FF018786</color>" \
            "    <color name=\"black\">#FF000000</color>" \
            "    <color name=\"white\">#FFFFFFFF</color>" \
            "</resources>" \
            > app/src/main/res/values/colors.xml
          
          printf '%s\n' \
            "<?xml version=\"1.0\" encoding=\"utf-8\"?>" \
            "<resources>" \
            "    <style name=\"Theme.OmniVentas\" parent=\"Theme.MaterialComponents.DayNight.NoActionBar\">" \
            "        <item name=\"colorPrimary\">@color/purple_500</item>" \
            "        <item name=\"colorPrimaryVariant\">@color/purple_700</item>" \
            "        <item name=\"colorOnPrimary\">@color/white</item>" \
            "        <item name=\"colorSecondary\">@color/teal_200</item>" \
            "        <item name=\"colorOnSecondary\">@color/black</item>" \
            "        <item name=\"android:statusBarColor\">?attr/colorPrimaryVariant</item>" \
            "    </style>" \
            "</resources>" \
            > app/src/main/res/values/themes.xml
          
          # ============================================
          # 11. ICONOS (launcher)
          # ============================================
          # Crear icono vectorial
          printf '%s\n' \
            '<?xml version="1.0" encoding="utf-8"?>' \
            '<vector xmlns:android="http://schemas.android.com/apk/res/android"' \
            '    android:width="108dp"' \
            '    android:height="108dp"' \
            '    android:viewportWidth="108"' \
            '    android:viewportHeight="108">' \
            '    <path' \
            '        android:fillColor="#4361EE"' \
            '        android:pathData="M54,27C40.5,27 30,37.5 30,51C30,64.5 40.5,75 54,75C67.5,75 78,64.5 78,51C78,37.5 67.5,27 54,27ZM54,69C44.1,69 36,60.9 36,51C36,41.1 44.1,33 54,33C63.9,33 72,41.1 72,51C72,60.9 63.9,69 54,69ZM54,39C47.4,39 42,44.4 42,51C42,57.6 47.4,63 54,63C60.6,63 66,57.6 66,51C66,44.4 60.6,39 54,39Z"/>' \
            '    <path' \
            '        android:fillColor="#FFFFFF"' \
            '        android:pathData="M54,45C50.7,45 48,47.7 48,51C48,54.3 50.7,57 54,57C57.3,57 60,54.3 60,51C60,47.7 57.3,45 54,45Z"/>' \
            '</vector>' \
            > app/src/main/res/drawable/ic_launcher_foreground.xml
          
          # Crear adaptive icons
          printf '%s\n' \
            '<?xml version="1.0" encoding="utf-8"?>' \
            '<adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">' \
            '    <background android:drawable="@color/white"/>' \
            '    <foreground android:drawable="@drawable/ic_launcher_foreground"/>' \
            '</adaptive-icon>' \
            > app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml
          
          cp app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml \
             app/src/main/res/mipmap-anydpi-v26/ic_launcher_round.xml
          
          # Crear iconos PNG (1x1 pixel transparente)
          for dir in mipmap-mdpi mipmap-hdpi mipmap-xhdpi mipmap-xxhdpi mipmap-xxxhdpi; do
            echo -n "iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAYAAAAfFcSJAAAADUlEQVR42mP8z8BQDwAEhQGAhKmMIQAAAABJRU5ErkJggg==" | base64 -d > app/src/main/res/$dir/ic_launcher.png
            echo -n "iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAYAAAAfFcSJAAAADUlEQVR42mP8z8BQDwAEhQGAhKmMIQAAAABJRU5ErkJggg==" | base64 -d > app/src/main/res/$dir/ic_launcher_round.png
          done
          
          echo "✅ Proyecto Android completo creado!"
          echo "📁 Archivos creados:"
          find . -type f -name "*.gradle" -o -name "*.xml" -o -name "*.java" -o -name "*.properties" | head -20

      - name: Build Debug APK
        run: |
          cd android-app
          ./gradlew assembleDebug --no-daemon

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: android-app/app/build/outputs/apk/debug/*.apk

      - name: Build Release APK
        run: |
          cd android-app
          ./gradlew assembleRelease --no-daemon

      - name: Upload Release APK (unsigned)
        uses: actions/upload-artifact@v4
        with:
          name: app-release-unsigned
          path: android-app/app/build/outputs/apk/release/*.apk

      # ============================================
      # FIRMAR APK (opcional)
      # ============================================
      - name: Check signing secrets
        id: check_secrets
        run: |
          if [ -n "${{ secrets.KEYSTORE_BASE64 }}" ] && \
             [ -n "${{ secrets.KEYSTORE_PASSWORD }}" ] && \
             [ -n "${{ secrets.KEY_ALIAS }}" ] && \
             [ -n "${{ secrets.KEY_PASSWORD }}" ]; then
            echo "has_secrets=true" >> $GITHUB_OUTPUT
            echo "✅ Secrets de firma encontrados"
          else
            echo "has_secrets=false" >> $GITHUB_OUTPUT
            echo "⚠️ Secrets de firma NO configurados"
          fi

      - name: Sign Release APK
        if: github.ref == 'refs/heads/main' && steps.check_secrets.outputs.has_secrets == 'true'
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > keystore.jks
          cd android-app
          ./gradlew assembleRelease \
            -Pandroid.injected.signing.store.file=$(pwd)/../keystore.jks \
            -Pandroid.injected.signing.store.password=${{ secrets.KEYSTORE_PASSWORD }} \
            -Pandroid.injected.signing.key.alias=${{ secrets.KEY_ALIAS }} \
            -Pandroid.injected.signing.key.password=${{ secrets.KEY_PASSWORD }}

      - name: Upload Signed APK
        if: github.ref == 'refs/heads/main' && steps.check_secrets.outputs.has_secrets == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: app-release-signed
          path: android-app/app/build/outputs/apk/release/*.apk

      - name: Notify success
        if: success()
        run: |
          echo "✅ APK compilados exitosamente!"
          echo "📱 Descarga los APKs desde los artifacts"
