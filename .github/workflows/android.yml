name: Build Android APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      # ✅ PASO CLAVE: Crear los archivos del wrapper si no existen
      - name: Setup Gradle Wrapper
        run: |
          echo "📁 Verificando archivos del wrapper..."
          
          # Crear el directorio wrapper si no existe
          mkdir -p android-app/gradle/wrapper
          
          # Crear gradle-wrapper.properties si no existe
          if [ ! -f "android-app/gradle/wrapper/gradle-wrapper.properties" ]; then
            echo "⚠️ gradle-wrapper.properties no encontrado, creándolo..."
            cat > android-app/gradle/wrapper/gradle-wrapper.properties << 'EOF'
            distributionBase=GRADLE_USER_HOME
            distributionPath=wrapper/dists
            distributionUrl=https\://services.gradle.org/distributions/gradle-8.2-bin.zip
            zipStoreBase=GRADLE_USER_HOME
            zipStorePath=wrapper/dists
            EOF
            echo "✅ gradle-wrapper.properties creado"
          else
            echo "✅ gradle-wrapper.properties existe"
          fi
          
          # Descargar gradle-wrapper.jar si no existe
          if [ ! -f "android-app/gradle/wrapper/gradle-wrapper.jar" ]; then
            echo "⚠️ gradle-wrapper.jar no encontrado, descargándolo..."
            curl -L -o android-app/gradle/wrapper/gradle-wrapper.jar \
              https://raw.githubusercontent.com/gradle/gradle/v8.2.0/gradle/wrapper/gradle-wrapper.jar
            echo "✅ gradle-wrapper.jar descargado"
          else
            echo "✅ gradle-wrapper.jar existe"
          fi
          
          # Asegurar permisos de ejecución para gradlew
          if [ -f "android-app/gradlew" ]; then
            chmod +x android-app/gradlew
            echo "✅ Permisos de ejecución para gradlew"
          else
            echo "⚠️ gradlew no encontrado, generándolo..."
            cd android-app
            gradle wrapper --gradle-version 8.2
            chmod +x gradlew
            cd ..
            echo "✅ gradlew generado"
          fi
          
          echo "📁 Contenido final de android-app/gradle/wrapper/:"
          ls -la android-app/gradle/wrapper/

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.2'
          build-root-directory: android-app

      - name: Build Debug APK
        run: |
          cd android-app
          ./gradlew assembleDebug --no-daemon

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: android-app/app/build/outputs/apk/debug/*.apk

      - name: Build Release APK
        run: |
          cd android-app
          ./gradlew assembleRelease --no-daemon

      - name: Upload Release APK (unsigned)
        uses: actions/upload-artifact@v4
        with:
          name: app-release-unsigned
          path: android-app/app/build/outputs/apk/release/*.apk

      - name: Check signing secrets
        id: check_secrets
        run: |
          if [ -n "${{ secrets.KEYSTORE_BASE64 }}" ] && \
             [ -n "${{ secrets.KEYSTORE_PASSWORD }}" ] && \
             [ -n "${{ secrets.KEY_ALIAS }}" ] && \
             [ -n "${{ secrets.KEY_PASSWORD }}" ]; then
            echo "has_secrets=true" >> $GITHUB_OUTPUT
            echo "✅ Secrets de firma encontrados"
          else
            echo "has_secrets=false" >> $GITHUB_OUTPUT
            echo "⚠️ Secrets de firma NO configurados"
          fi

      - name: Sign Release APK
        if: github.ref == 'refs/heads/main' && steps.check_secrets.outputs.has_secrets == 'true'
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > keystore.jks
          cd android-app
          ./gradlew assembleRelease \
            -Pandroid.injected.signing.store.file=$(pwd)/../keystore.jks \
            -Pandroid.injected.signing.store.password=${{ secrets.KEYSTORE_PASSWORD }} \
            -Pandroid.injected.signing.key.alias=${{ secrets.KEY_ALIAS }} \
            -Pandroid.injected.signing.key.password=${{ secrets.KEY_PASSWORD }}

      - name: Upload Signed APK
        if: github.ref == 'refs/heads/main' && steps.check_secrets.outputs.has_secrets == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: app-release-signed
          path: android-app/app/build/outputs/apk/release/*.apk

      - name: Notify success
        if: success()
        run: |
          echo "✅ APK compilados exitosamente!"
          echo "📱 Descarga los APKs desde los artifacts"
