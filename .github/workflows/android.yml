            "                businessName = sessionManager.getBusinessName() != null ? sessionManager.getBusinessName() : \"DESCONOCIDO\";" \
            "            }" \
            "" \
            "            JsonObject jsonData = new JsonObject();" \
            "            jsonData.addProperty(\"level\", level);" \
