              <solid android:color="@color/light_gray" />
              <corners android:radius="16dp" />
              <stroke android:width="2dp" android:color="@color/gray_light" />
          </shape>
          EOF
          
          cat > app/src/main/res/drawable/bg_input_login_focused.xml << 'EOF'
