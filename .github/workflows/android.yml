                  android:pathData="M12,12c2.21,0 4,-1.79 4,-4s-1.79,-4 -4,-4 -4,1.79 -4,4 1.79,4 4,4zM12,14c-2.67,0 -8,1.34 -8,4v2h16v-2c0,-2.66 -5.33,-4 -8,-4z"/>
              <path
                  android:fillColor="@color/white"
                  android:pathData="M12,12c-0.83,0 -1.5,-0.67 -1.5,-1.5S11.17,9 12,9s1.5,0.67 1.5,1.5S12.83,12 12,12zM12,10c-0.28,0 -0.5,0.22 -0.5,0.5S11.72,11 12,11s0.5,-0.22 0.5,-0.5S12.28,10 12,10z"/>
          </vector>
          EOF
          
          cat > app/src/main/res/drawable/ic_vendor_id.xml << 'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="24dp"
              android:height="24dp"
              android:viewportWidth="24"
              android:viewportHeight="24">
