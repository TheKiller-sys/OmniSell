name: Build Android APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    permissions:
      contents: write  # 🔑 Necesario para subir archivos al repo
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      # ============================================
      # CREAR PROYECTO ANDROID COMPLETO CON NUEVO DISEÑO DE LOGIN
      # ============================================
      - name: Create full Android project with new login design
        run: |
          echo "📱 Creando proyecto Android con nuevo diseño de login..."
          
          # Crear estructura de directorios
          mkdir -p android-app/app/src/main/java/com/omniventas/app
          mkdir -p android-app/app/src/main/java/com/omniventas/app/api
          mkdir -p android-app/app/src/main/java/com/omniventas/app/models
          mkdir -p android-app/app/src/main/java/com/omniventas/app/ui
          mkdir -p android-app/app/src/main/java/com/omniventas/app/utils
          mkdir -p android-app/app/src/main/res/layout
          mkdir -p android-app/app/src/main/res/values
          mkdir -p android-app/app/src/main/res/drawable
          mkdir -p android-app/app/src/main/res/menu
          mkdir -p android-app/app/src/main/res/mipmap-hdpi
          mkdir -p android-app/app/src/main/res/mipmap-mdpi
          mkdir -p android-app/app/src/main/res/mipmap-xhdpi
          mkdir -p android-app/app/src/main/res/mipmap-xxhdpi
          mkdir -p android-app/app/src/main/res/mipmap-xxxhdpi
          mkdir -p android-app/app/src/main/res/mipmap-anydpi-v26
          mkdir -p android-app/gradle/wrapper
          
          cd android-app
          
          # ============================================
          # GRADLE WRAPPER
          # ============================================
          printf '%s\n' \
            "distributionBase=GRADLE_USER_HOME" \
            "distributionPath=wrapper/dists" \
            "distributionUrl=https\://services.gradle.org/distributions/gradle-8.2-bin.zip" \
            "zipStoreBase=GRADLE_USER_HOME" \
            "zipStorePath=wrapper/dists" \
            > gradle/wrapper/gradle-wrapper.properties
          
          curl -L -o gradle/wrapper/gradle-wrapper.jar \
            https://raw.githubusercontent.com/gradle/gradle/v8.2.0/gradle/wrapper/gradle-wrapper.jar
          
          printf '%s\n' \
            '#!/bin/sh' \
            'APP_HOME=$(cd "$(dirname "$0")" && pwd)' \
            'CLASSPATH=$APP_HOME/gradle/wrapper/gradle-wrapper.jar' \
            'exec java -cp "$CLASSPATH" org.gradle.wrapper.GradleWrapperMain "$@"' \
            > gradlew
          chmod +x gradlew
          
          # ============================================
          # GRADLE PROPERTIES
          # ============================================
          printf '%s\n' \
            "android.useAndroidX=true" \
            "android.enableJetifier=true" \
            "org.gradle.jvmargs=-Xmx2048m -XX:MaxMetaspaceSize=512m" \
            "org.gradle.parallel=true" \
            "org.gradle.caching=true" \
            > gradle.properties
          
          # ============================================
          # SETTINGS.GRADLE
          # ============================================
          printf '%s\n' \
            "pluginManagement {" \
            "    repositories {" \
            "        google()" \
            "        mavenCentral()" \
            "        gradlePluginPortal()" \
            "    }" \
            "}" \
            "dependencyResolutionManagement {" \
            "    repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)" \
            "    repositories {" \
            "        google()" \
            "        mavenCentral()" \
            "    }" \
            "}" \
            "rootProject.name = \"OmniVentas\"" \
            "include ':app'" \
            > settings.gradle
          
          # ============================================
          # BUILD.GRADLE (proyecto)
          # ============================================
          printf '%s\n' \
            "plugins {" \
            "    id 'com.android.application' version '8.2.0' apply false" \
            "}" \
            > build.gradle
          
          # ============================================
          # BUILD.GRADLE (app) - CON TODAS LAS DEPENDENCIAS
          # ============================================
          printf '%s\n' \
            "plugins {" \
            "    id 'com.android.application'" \
            "}" \
            "" \
            "android {" \
            "    namespace 'com.omniventas.app'" \
            "    compileSdk 34" \
            "" \
            "    defaultConfig {" \
            "        applicationId \"com.omniventas.app\"" \
            "        minSdk 21" \
            "        targetSdk 34" \
            "        versionCode 1" \
            "        versionName \"1.0\"" \
            "        testInstrumentationRunner \"androidx.test.runner.AndroidJUnitRunner\"" \
            "    }" \
            "" \
            "    buildTypes {" \
            "        release {" \
            "            minifyEnabled false" \
            "            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'" \
            "        }" \
            "        debug {" \
            "            minifyEnabled false" \
            "        }" \
            "    }" \
            "" \
            "    compileOptions {" \
            "        sourceCompatibility JavaVersion.VERSION_1_8" \
            "        targetCompatibility JavaVersion.VERSION_1_8" \
            "    }" \
            "}" \
            "" \
            "dependencies {" \
            "    implementation 'androidx.appcompat:appcompat:1.6.1'" \
            "    implementation 'com.google.android.material:material:1.10.0'" \
            "    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'" \
            "    implementation 'androidx.recyclerview:recyclerview:1.3.2'" \
            "    implementation 'androidx.cardview:cardview:1.0.0'" \
            "    implementation 'androidx.swiperefreshlayout:swiperefreshlayout:1.1.0'" \
            "" \
            "    implementation 'com.squareup.retrofit2:retrofit:2.9.0'" \
            "    implementation 'com.squareup.retrofit2:converter-gson:2.9.0'" \
            "    implementation 'com.squareup.okhttp3:logging-interceptor:4.11.0'" \
            "" \
            "    implementation 'com.auth0:java-jwt:4.4.0'" \
            "" \
            "    implementation 'androidx.security:security-crypto:1.1.0-alpha06'" \
            "" \
            "    testImplementation 'junit:junit:4.13.2'" \
            "    androidTestImplementation 'androidx.test.ext:junit:1.1.5'" \
            "    androidTestImplementation 'androidx.test.espresso:espresso-core:3.5.1'" \
            "}" \
            > app/build.gradle
          
          # ============================================
          # PROGUARD
          # ============================================
          printf '%s\n' \
            "# Add project specific ProGuard rules here." \
            "-keep class com.omniventas.app.** { *; }" \
            > app/proguard-rules.pro
          
          # ============================================
          # ANDROID MANIFEST
          # ============================================
          printf '%s\n' \
            "<?xml version=\"1.0\" encoding=\"utf-8\"?>" \
            "<manifest xmlns:android=\"http://schemas.android.com/apk/res/android\"" \
            "    xmlns:tools=\"http://schemas.android.com/tools\">" \
            "" \
            "    <uses-permission android:name=\"android.permission.INTERNET\" />" \
            "    <uses-permission android:name=\"android.permission.ACCESS_NETWORK_STATE\" />" \
            "" \
            "    <application" \
            "        android:allowBackup=\"true\"" \
            "        android:icon=\"@mipmap/ic_launcher\"" \
            "        android:label=\"@string/app_name\"" \
            "        android:roundIcon=\"@mipmap/ic_launcher_round\"" \
            "        android:supportsRtl=\"true\"" \
            "        android:theme=\"@style/Theme.OmniVentas\"" \
            "        android:usesCleartextTraffic=\"true\"" \
            "        tools:targetApi=\"31\">" \
            "" \
            "        <activity" \
            "            android:name=\".LoginActivity\"" \
            "            android:exported=\"true\"" \
            "            android:screenOrientation=\"portrait\">" \
            "            <intent-filter>" \
            "                <action android:name=\"android.intent.action.MAIN\" />" \
            "                <category android:name=\"android.intent.category.LAUNCHER\" />" \
            "            </intent-filter>" \
            "        </activity>" \
            "" \
            "        <activity" \
            "            android:name=\".MainActivity\"" \
            "            android:exported=\"false\"" \
            "            android:screenOrientation=\"portrait\" />" \
            "" \
            "    </application>" \
            "" \
            "</manifest>" \
            > app/src/main/AndroidManifest.xml
          
          # ============================================
          # COLORS.XML - ACTUALIZADO
          # ============================================
          printf '%s\n' \
            "<?xml version=\"1.0\" encoding=\"utf-8\"?>" \
            "<resources>" \
            "    <color name=\"primary\">#4361EE</color>" \
            "    <color name=\"primary_dark\">#3A56D4</color>" \
            "    <color name=\"primary_light\">#6C8CFF</color>" \
            "    <color name=\"secondary\">#3F37C9</color>" \
            "    <color name=\"success\">#4CC9F0</color>" \
            "    <color name=\"warning\">#FFD166</color>" \
            "    <color name=\"danger\">#EF476F</color>" \
            "    <color name=\"dark\">#212529</color>" \
            "    <color name=\"dark_secondary\">#343A40</color>" \
            "    <color name=\"light_gray\">#F5F7FB</color>" \
            "    <color name=\"gray\">#6C757D</color>" \
            "    <color name=\"gray_light\">#E9ECEF</color>" \
            "    <color name=\"white\">#FFFFFF</color>" \
            "    <color name=\"bottom_nav_tint\">@color/primary</color>" \
            "</resources>" \
            > app/src/main/res/values/colors.xml
          
          # ============================================
          # STRINGS.XML
          # ============================================
          printf '%s\n' \
            "<?xml version=\"1.0\" encoding=\"utf-8\"?>" \
            "<resources>" \
            "    <string name=\"app_name\">OmniVentas</string>" \
            "</resources>" \
            > app/src/main/res/values/strings.xml
          
          # ============================================
          # THEMES.XML - ACTUALIZADO
          # ============================================
          printf '%s\n' \
            "<?xml version=\"1.0\" encoding=\"utf-8\"?>" \
            "<resources>" \
            "    <style name=\"Theme.OmniVentas\" parent=\"Theme.MaterialComponents.DayNight.NoActionBar\">" \
            "        <item name=\"colorPrimary\">@color/primary</item>" \
            "        <item name=\"colorPrimaryVariant\">@color/primary_dark</item>" \
            "        <item name=\"colorOnPrimary\">@color/white</item>" \
            "        <item name=\"colorSecondary\">@color/secondary</item>" \
            "        <item name=\"colorOnSecondary\">@color/white</item>" \
            "        <item name=\"android:statusBarColor\">@color/primary</item>" \
            "        <item name=\"android:windowBackground\">@color/light_gray</item>" \
            "    </style>" \
            "</resources>" \
            > app/src/main/res/values/themes.xml
          
          # ============================================
          # ACTIVITY_LOGIN.XML - NUEVO DISEÑO PARA VENDEDORES
          # ============================================
          printf '%s\n' \
            "<?xml version=\"1.0\" encoding=\"utf-8\"?>" \
            "<LinearLayout xmlns:android=\"http://schemas.android.com/apk/res/android\"" \
            "    xmlns:app=\"http://schemas.android.com/apk/res-auto\"" \
            "    android:layout_width=\"match_parent\"" \
            "    android:layout_height=\"match_parent\"" \
            "    android:orientation=\"vertical\"" \
            "    android:gravity=\"center\"" \
            "    android:padding=\"32dp\"" \
            "    android:background=\"@color/light_gray\">" \
            "" \
            "    <!-- Logo con animación de entrada -->" \
            "    <ImageView" \
            "        android:id=\"@+id/iv_logo\"" \
            "        android:layout_width=\"100dp\"" \
            "        android:layout_height=\"100dp\"" \
            "        android:src=\"@drawable/ic_launcher_foreground\"" \
            "        android:layout_marginBottom=\"16dp\"" \
            "        android:scaleType=\"centerInside\" />" \
            "" \
            "    <!-- Título -->" \
            "    <TextView" \
            "        android:id=\"@+id/tv_title\"" \
            "        android:layout_width=\"wrap_content\"" \
            "        android:layout_height=\"wrap_content\"" \
            "        android:text=\"OmniVentas\"" \
            "        android:textSize=\"32sp\"" \
            "        android:textStyle=\"bold\"" \
            "        android:textColor=\"@color/primary\"" \
            "        android:layout_marginBottom=\"4dp\" />" \
            "" \
            "    <TextView" \
            "        android:id=\"@+id/tv_subtitle\"" \
            "        android:layout_width=\"wrap_content\"" \
            "        android:layout_height=\"wrap_content\"" \
            "        android:text=\"Acceso para Vendedores\"" \
            "        android:textSize=\"16sp\"" \
            "        android:textColor=\"@color/gray\"" \
            "        android:layout_marginBottom=\"32dp\" />" \
            "" \
            "    <!-- Card contenedor -->" \
            "    <androidx.cardview.widget.CardView" \
            "        android:id=\"@+id/card_login\"" \
            "        android:layout_width=\"match_parent\"" \
            "        android:layout_height=\"wrap_content\"" \
            "        app:cardCornerRadius=\"24dp\"" \
            "        app:cardElevation=\"8dp\"" \
            "        app:cardBackgroundColor=\"@color/white\">" \
            "" \
            "        <LinearLayout" \
            "            android:layout_width=\"match_parent\"" \
            "            android:layout_height=\"wrap_content\"" \
            "            android:orientation=\"vertical\"" \
            "            android:padding=\"24dp\">" \
            "" \
            "            <!-- Icono de vendedor -->" \
            "            <ImageView" \
            "                android:layout_width=\"64dp\"" \
            "                android:layout_height=\"64dp\"" \
            "                android:src=\"@drawable/ic_vendor\"" \
            "                android:layout_gravity=\"center\"" \
            "                android:layout_marginBottom=\"16dp\" />" \
            "" \
            "            <TextView" \
            "                android:layout_width=\"wrap_content\"" \
            "                android:layout_height=\"wrap_content\"" \
            "                android:text=\"ID de Vendedor\"" \
            "                android:textSize=\"14sp\"" \
            "                android:textColor=\"@color/gray\"" \
            "                android:layout_marginBottom=\"8dp\" />" \
            "" \
            "            <!-- Campo de entrada con ícono -->" \
            "            <LinearLayout" \
            "                android:layout_width=\"match_parent\"" \
            "                android:layout_height=\"wrap_content\"" \
            "                android:orientation=\"horizontal\"" \
            "                android:background=\"@drawable/edit_text_background\"" \
            "                android:padding=\"4dp\"" \
            "                android:layout_marginBottom=\"20dp\">" \
            "" \
            "                <ImageView" \
            "                    android:layout_width=\"24dp\"" \
            "                    android:layout_height=\"24dp\"" \
            "                    android:src=\"@drawable/ic_vendor_id\"" \
            "                    android:layout_gravity=\"center\"" \
            "                    android:layout_marginStart=\"12dp\" />" \
            "" \
            "                <EditText" \
            "                    android:id=\"@+id/et_vendor_id\"" \
            "                    android:layout_width=\"0dp\"" \
            "                    android:layout_height=\"wrap_content\"" \
            "                    android:layout_weight=\"1\"" \
            "                    android:hint=\"Ej: VEN-001\"" \
            "                    android:inputType=\"text\"" \
            "                    android:background=\"@android:color/transparent\"" \
            "                    android:padding=\"12dp\"" \
            "                    android:textSize=\"16dp\"" \
            "                    android:textColor=\"@color/dark\" />" \
            "            </LinearLayout>" \
            "" \
            "            <!-- Botón de inicio de sesión -->" \
            "            <Button" \
            "                android:id=\"@+id/btn_login\"" \
            "                android:layout_width=\"match_parent\"" \
            "                android:layout_height=\"56dp\"" \
            "                android:text=\"Ingresar\"" \
            "                android:textSize=\"16sp\"" \
            "                android:textStyle=\"bold\"" \
            "                android:backgroundTint=\"@color/primary\"" \
            "                app:cornerRadius=\"12dp\" />" \
            "" \
            "            <!-- Texto de ayuda -->" \
            "            <TextView" \
            "                android:layout_width=\"wrap_content\"" \
            "                android:layout_height=\"wrap_content\"" \
            "                android:text=\"Contacta al administrador para obtener tu ID\"" \
            "                android:textSize=\"12sp\"" \
            "                android:textColor=\"@color/gray\"" \
            "                android:layout_gravity=\"center\"" \
            "                android:layout_marginTop=\"16dp\" />" \
            "" \
            "        </LinearLayout>" \
            "    </androidx.cardview.widget.CardView>" \
            "" \
            "</LinearLayout>" \
            > app/src/main/res/layout/activity_login.xml
          
          # ============================================
          # LOGIN ACTIVITY - CON NUEVA LÓGICA
          # ============================================
          printf '%s\n' \
            "package com.omniventas.app;" \
            "" \
            "import android.animation.ObjectAnimator;" \
            "import android.os.Bundle;" \
            "import android.view.View;" \
            "import android.widget.Button;" \
            "import android.widget.EditText;" \
            "import android.widget.Toast;" \
            "import androidx.appcompat.app.AppCompatActivity;" \
            "import androidx.cardview.widget.CardView;" \
            "" \
            "public class LoginActivity extends AppCompatActivity {" \
            "" \
            "    private EditText etVendorId;" \
            "    private Button btnLogin;" \
            "    private CardView cardLogin;" \
            "" \
            "    @Override" \
            "    protected void onCreate(Bundle savedInstanceState) {" \
            "        super.onCreate(savedInstanceState);" \
            "        setContentView(R.layout.activity_login);" \
            "" \
            "        etVendorId = findViewById(R.id.et_vendor_id);" \
            "        btnLogin = findViewById(R.id.btn_login);" \
            "        cardLogin = findViewById(R.id.card_login);" \
            "" \
            "        // Animación de entrada de la tarjeta" \
            "        cardLogin.setTranslationY(100f);" \
            "        cardLogin.setAlpha(0f);" \
            "        cardLogin.animate()" \
            "            .translationY(0f)" \
            "            .alpha(1f)" \
            "            .setDuration(600)" \
            "            .start();" \
            "" \
            "        btnLogin.setOnClickListener(v -> performLogin());" \
            "    }" \
            "" \
            "    private void performLogin() {" \
            "        String vendorId = etVendorId.getText().toString().trim();" \
            "" \
            "        if (vendorId.isEmpty()) {" \
            "            etVendorId.setError(\"Ingresa tu ID de vendedor\");" \
            "            etVendorId.requestFocus();" \
            "            shakeView(etVendorId);" \
            "            return;" \
            "        }" \
            "" \
            "        btnLogin.setEnabled(false);" \
            "        btnLogin.setText(\"Verificando...\");" \
            "" \
            "        // Simular verificación del ID" \
            "        btnLogin.postDelayed(() -> {" \
            "            Toast.makeText(LoginActivity.this, \"✅ ¡Bienvenido Vendedor!\", Toast.LENGTH_LONG).show();" \
            "            btnLogin.setEnabled(true);" \
            "            btnLogin.setText(\"Ingresar\");" \
            "        }, 1500);" \
            "    }" \
            "" \
            "    private void shakeView(View view) {" \
            "        ObjectAnimator shake = ObjectAnimator.ofFloat(view, \"translationX\", 0f, -20f, 20f, -20f, 20f, -10f, 10f, 0f);" \
            "        shake.setDuration(500);" \
            "        shake.start();" \
            "    }" \
            "}" \
            > app/src/main/java/com/omniventas/app/LoginActivity.java
          
          # ============================================
          # IC_VENDOR.XML - NUEVO ICONO DE VENDEDOR
          # ============================================
          printf '%s\n' \
            "<?xml version=\"1.0\" encoding=\"utf-8\"?>" \
            "<vector xmlns:android=\"http://schemas.android.com/apk/res/android\"" \
            "    android:width=\"64dp\"" \
            "    android:height=\"64dp\"" \
            "    android:viewportWidth=\"24\"" \
            "    android:viewportHeight=\"24\">" \
            "    <path" \
            "        android:fillColor=\"@color/primary\"" \
            "        android:pathData=\"M12,12c2.21,0 4,-1.79 4,-4s-1.79,-4 -4,-4 -4,1.79 -4,4 1.79,4 4,4zM12,14c-2.67,0 -8,1.34 -8,4v2h16v-2c0,-2.66 -5.33,-4 -8,-4z\"/>" \
            "    <path" \
            "        android:fillColor=\"@color/white\"" \
            "        android:pathData=\"M12,12c-0.83,0 -1.5,-0.67 -1.5,-1.5S11.17,9 12,9s1.5,0.67 1.5,1.5S12.83,12 12,12zM12,10c-0.28,0 -0.5,0.22 -0.5,0.5S11.72,11 12,11s0.5,-0.22 0.5,-0.5S12.28,10 12,10z\"/>" \
            "</vector>" \
            > app/src/main/res/drawable/ic_vendor.xml
          
          # ============================================
          # IC_VENDOR_ID.XML - NUEVO ICONO DE ID
          # ============================================
          printf '%s\n' \
            "<?xml version=\"1.0\" encoding=\"utf-8\"?>" \
            "<vector xmlns:android=\"http://schemas.android.com/apk/res/android\"" \
            "    android:width=\"24dp\"" \
            "    android:height=\"24dp\"" \
            "    android:viewportWidth=\"24\"" \
            "    android:viewportHeight=\"24\">" \
            "    <path" \
            "        android:fillColor=\"@color/gray\"" \
            "        android:pathData=\"M20,4H4c-1.1,0 -2,0.9 -2,2v12c0,1.1 0.9,2 2,2h16c1.1,0 2,-0.9 2,-2V6c0,-1.1 -0.9,-2 -2,-2zM4,6h16v2H4V6zM4,12v-2h4v2H4zM4,10V8h4v2H4zM12,12H8v-2h4v2zM12,10H8V8h4v2zM20,12h-6v-2h6v2zM20,10h-6V8h6v2zM4,16v-2h16v2H4z\"/>" \
            "</vector>" \
            > app/src/main/res/drawable/ic_vendor_id.xml
          
          # ============================================
          # EDIT_TEXT_BACKGROUND.XML
          # ============================================
          printf '%s\n' \
            "<?xml version=\"1.0\" encoding=\"utf-8\"?>" \
            "<shape xmlns:android=\"http://schemas.android.com/apk/res/android\">" \
            "    <solid android:color=\"@color/white\" />" \
            "    <stroke android:width=\"1dp\" android:color=\"@color/gray_light\" />" \
            "    <corners android:radius=\"12dp\" />" \
            "</shape>" \
            > app/src/main/res/drawable/edit_text_background.xml
          
          # ============================================
          # ICONOS DEL MENÚ (Dashboard, Ventas, Inventario, Logout)
          # ============================================
          printf '%s\n' \
            "<?xml version=\"1.0\" encoding=\"utf-8\"?>" \
            "<vector xmlns:android=\"http://schemas.android.com/apk/res/android\"" \
            "    android:width=\"24dp\"" \
            "    android:height=\"24dp\"" \
            "    android:viewportWidth=\"24\"" \
            "    android:viewportHeight=\"24\">" \
            "    <path" \
            "        android:fillColor=\"#000000\"" \
            "        android:pathData=\"M3,13h8L11,3L3,3v10zM3,21h8v-6L3,15v6zM13,21h8L21,11h-8v10zM13,3v6h8L21,3h-8z\"/>" \
            "</vector>" \
            > app/src/main/res/drawable/ic_dashboard.xml
          
          printf '%s\n' \
            "<?xml version=\"1.0\" encoding=\"utf-8\"?>" \
            "<vector xmlns:android=\"http://schemas.android.com/apk/res/android\"" \
            "    android:width=\"24dp\"" \
            "    android:height=\"24dp\"" \
            "    android:viewportWidth=\"24\"" \
            "    android:viewportHeight=\"24\">" \
