      - name: Create Login Layout
        run: |
          cd android-app
          cat > app/src/main/res/layout/activity_login.xml << 'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <LinearLayout xmlns:android="http://schemas.android.com/apk/res/android"
              xmlns:app="http://schemas.android.com/apk/res-auto"
              android:layout_width="match_parent"
              android:layout_height="match_parent"
              android:orientation="vertical"
              android:gravity="center"
              android:padding="24dp"
              android:background="@color/white"
              android:fitsSystemWindows="true">
          
              <ImageView
                  android:id="@+id/iv_logo"
                  android:layout_width="120dp"
                  android:layout_height="120dp"
                  android:src="@mipmap/ic_launcher"
                  android:layout_marginBottom="8dp"
                  android:scaleType="centerInside" />
          
              <TextView
                  android:id="@+id/tv_title"
                  android:layout_width="wrap_content"
                  android:layout_height="wrap_content"
                  android:text="@string/login_title"
                  android:textSize="36sp"
                  android:textStyle="bold"
                  android:textColor="@color/primary"
                  android:layout_marginBottom="4dp" />
          
              <TextView
                  android:id="@+id/tv_subtitle"
                  android:layout_width="wrap_content"
                  android:layout_height="wrap_content"
                  android:text="@string/login_subtitle"
                  android:textSize="16sp"
                  android:textColor="@color/gray"
                  android:layout_marginBottom="32dp" />
          
              <androidx.cardview.widget.CardView
                  android:id="@+id/card_login"
                  android:layout_width="match_parent"
                  android:layout_height="wrap_content"
                  app:cardCornerRadius="24dp"
                  app:cardElevation="8dp"
                  app:cardBackgroundColor="@color/white">
          
                  <LinearLayout
                      android:layout_width="match_parent"
                      android:layout_height="wrap_content"
                      android:orientation="vertical"
                      android:padding="28dp">
          
                      <ImageView
                          android:layout_width="72dp"
                          android:layout_height="72dp"
                          android:src="@drawable/ic_vendor"
                          android:layout_gravity="center"
                          android:layout_marginBottom="16dp" />
          
                      <TextView
                          android:layout_width="wrap_content"
                          android:layout_height="wrap_content"
                          android:text="ID de Vendedor"
                          android:textSize="14sp"
                          android:textColor="@color/gray"
                          android:layout_marginBottom="8dp"
                          android:fontFamily="sans-serif-medium" />
          
                      <LinearLayout
                          android:layout_width="match_parent"
                          android:layout_height="wrap_content"
                          android:orientation="horizontal"
                          android:background="@drawable/bg_input_login"
                          android:padding="4dp"
                          android:layout_marginBottom="16dp">
          
                          <ImageView
                              android:layout_width="24dp"
                              android:layout_height="24dp"
                              android:src="@drawable/ic_vendor_id"
                              android:layout_gravity="center"
                              android:layout_marginStart="16dp" />
          
                          <EditText
                              android:id="@+id/et_vendor_id"
                              android:layout_width="0dp"
                              android:layout_height="wrap_content"
                              android:layout_weight="1"
                              android:hint="@string/login_hint"
                              android:inputType="text"
                              android:background="@android:color/transparent"
                              android:padding="14dp"
                              android:textSize="18dp"
                              android:textColor="@color/dark"
                              android:maxLength="8"
                              android:fontFamily="sans-serif-medium"
                              android:imeOptions="actionDone"
                              android:importantForAutofill="no" />
                      </LinearLayout>
          
                      <TextView
                          android:id="@+id/tv_error"
                          android:layout_width="match_parent"
                          android:layout_height="wrap_content"
                          android:textColor="@color/danger"
                          android:textSize="14sp"
                          android:gravity="center"
                          android:padding="12dp"
                          android:background="@drawable/bg_error"
                          android:visibility="gone"
                          android:layout_marginBottom="12dp"
                          android:fontFamily="sans-serif" />
          
                      <ProgressBar
                          android:id="@+id/progressBar"
                          android:layout_width="wrap_content"
                          android:layout_height="wrap_content"
                          android:layout_gravity="center"
                          android:visibility="gone"
                          android:layout_marginBottom="12dp"
                          android:indeterminateTint="@color/primary" />
          
                      <Button
                          android:id="@+id/btn_login"
                          android:layout_width="match_parent"
                          android:layout_height="56dp"
                          android:text="@string/login_button"
                          android:textSize="18sp"
                          android:textStyle="bold"
                          android:textColor="@color/white"
                          android:background="@drawable/bg_button_login"
                          android:stateListAnimator="@null"
                          android:elevation="4dp" />
          
                      <TextView
                          android:layout_width="wrap_content"
                          android:layout_height="wrap_content"
                          android:text="@string/login_help"
                          android:textSize="12sp"
                          android:textColor="@color/gray"
                          android:layout_gravity="center"
                          android:layout_marginTop="16dp" />
          
                      <TextView
                          android:layout_width="wrap_content"
                          android:layout_height="wrap_content"
                          android:text="v9.0.0"
                          android:textSize="11sp"
                          android:textColor="@color/gray"
                          android:layout_gravity="center"
                          android:layout_marginTop="12dp"
                          android:alpha="0.6" />
          
                  </LinearLayout>
              </androidx.cardview.widget.CardView>
          
          </LinearLayout>
          EOF

      - name: Create Main Layout
        run: |
          cd android-app
          cat > app/src/main/res/layout/activity_main.xml << 'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <LinearLayout xmlns:android="http://schemas.android.com/apk/res/android"
              xmlns:app="http://schemas.android.com/apk/res-auto"
              android:layout_width="match_parent"
              android:layout_height="match_parent"
              android:orientation="vertical"
              android:background="@color/light_gray">
          
              <!-- Barra de estado offline -->
              <LinearLayout
                  android:id="@+id/ll_offline_indicator"
                  android:layout_width="match_parent"
                  android:layout_height="wrap_content"
                  android:background="@color/warning"
                  android:padding="6dp"
                  android:orientation="horizontal"
                  android:gravity="center"
                  android:visibility="gone">
                  <ImageView
                      android:layout_width="16dp"
                      android:layout_height="16dp"
                      android:src="@drawable/ic_sync"
                      android:tint="@color/white"
                      android:layout_marginEnd="8dp" />
                  <TextView
                      android:layout_width="wrap_content"
                      android:layout_height="wrap_content"
                      android:text="@string/offline_mode"
                      android:textColor="@color/white"
                      android:textSize="12sp"
                      android:textStyle="bold" />
              </LinearLayout>
          
              <FrameLayout
                  android:id="@+id/fragment_container"
                  android:layout_width="match_parent"
                  android:layout_height="0dp"
                  android:layout_weight="1" />
          
              <com.google.android.material.bottomnavigation.BottomNavigationView
                  android:id="@+id/bottom_navigation"
                  android:layout_width="match_parent"
                  android:layout_height="wrap_content"
                  android:background="@color/bottom_nav_background"
                  app:menu="@menu/bottom_nav_menu"
                  app:itemIconTint="@color/bottom_nav_tint"
                  app:itemTextColor="@color/bottom_nav_tint"
                  android:elevation="8dp" />
          
          </LinearLayout>
          EOF

      - name: Create Dashboard Layout (Modern Design)
        run: |
          cd android-app
          cat > app/src/main/res/layout/fragment_dashboard.xml << 'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <ScrollView xmlns:android="http://schemas.android.com/apk/res/android"
              xmlns:app="http://schemas.android.com/apk/res-auto"
              android:layout_width="match_parent"
              android:layout_height="match_parent"
              android:background="@color/light_gray"
              android:fillViewport="true">
          
              <LinearLayout
                  android:layout_width="match_parent"
                  android:layout_height="wrap_content"
                  android:orientation="vertical"
                  android:padding="16dp">
          
                  <!-- Header -->
                  <LinearLayout
                      android:layout_width="match_parent"
                      android:layout_height="wrap_content"
                      android:orientation="horizontal"
                      android:gravity="center_vertical"
                      android:layout_marginBottom="20dp">
          
                      <LinearLayout
                          android:layout_width="0dp"
                          android:layout_height="wrap_content"
                          android:layout_weight="1"
                          android:orientation="vertical">
          
                          <TextView
                              android:layout_width="wrap_content"
                              android:layout_height="wrap_content"
                              android:text="Dashboard"
                              android:textSize="24sp"
                              android:textStyle="bold"
                              android:textColor="@color/dark" />
          
                          <TextView
                              android:id="@+id/tv_greeting"
                              android:layout_width="wrap_content"
                              android:layout_height="wrap_content"
                              android:text="Good morning, Vendor"
                              android:textSize="14sp"
                              android:textColor="@color/gray" />
                      </LinearLayout>
          
                      <ImageView
                          android:layout_width="48dp"
                          android:layout_height="48dp"
                          android:src="@drawable/ic_user"
                          android:tint="@color/primary"
                          android:background="@drawable/bg_avatar"
                          android:padding="8dp" />
                  </LinearLayout>
          
                  <!-- Estado Offline -->
                  <TextView
                      android:id="@+id/tv_offline_status"
                      android:layout_width="match_parent"
                      android:layout_height="wrap_content"
                      android:text=""
                      android:textSize="12sp"
                      android:textColor="@color/warning"
                      android:gravity="center"
                      android:padding="8dp"
                      android:background="@color/warning_light"
                      android:layout_marginBottom="12dp"
                      android:visibility="gone" />
          
                  <!-- Live Now Card -->
                  <androidx.cardview.widget.CardView
                      android:layout_width="match_parent"
                      android:layout_height="wrap_content"
                      app:cardCornerRadius="20dp"
                      app:cardElevation="4dp"
                      app:cardBackgroundColor="@color/primary"
                      android:layout_marginBottom="16dp">
          
                      <LinearLayout
                          android:layout_width="match_parent"
                          android:layout_height="wrap_content"
                          android:orientation="vertical"
                          android:padding="20dp">
          
                          <LinearLayout
                              android:layout_width="match_parent"
                              android:layout_height="wrap_content"
                              android:orientation="horizontal"
                              android:gravity="center_vertical">
          
                              <View
                                  android:layout_width="8dp"
                                  android:layout_height="8dp"
                                  android:background="@drawable/bg_pulse"
                                  android:layout_marginEnd="8dp" />
          
                              <TextView
                                  android:layout_width="wrap_content"
                                  android:layout_height="wrap_content"
                                  android:text="Live Now"
                                  android:textColor="@color/white"
                                  android:textSize="14sp"
                                  android:fontFamily="sans-serif-medium" />
          
                              <View
                                  android:layout_width="0dp"
                                  android:layout_height="1dp"
                                  android:layout_weight="1" />
          
                              <TextView
                                  android:layout_width="wrap_content"
                                  android:layout_height="wrap_content"
                                  android:text="Today"
                                  android:textColor="@color/white_alpha_80"
                                  android:textSize="12sp" />
                          </LinearLayout>
          
                          <TextView
                              android:id="@+id/tv_live_revenue"
                              android:layout_width="wrap_content"
                              android:layout_height="wrap_content"
                              android:text="$0"
                              android:textColor="@color/white"
                              android:textSize="36sp"
                              android:textStyle="bold"
                              android:layout_marginTop="8dp" />
          
                          <LinearLayout
                              android:layout_width="match_parent"
                              android:layout_height="wrap_content"
                              android:orientation="horizontal"
                              android:gravity="center_vertical"
                              android:layout_marginTop="8dp">
          
                              <TextView
                                  android:id="@+id/tv_daily_goal_percent"
                                  android:layout_width="wrap_content"
                                  android:layout_height="wrap_content"
                                  android:text="0%"
                                  android:textColor="@color/white"
                                  android:textSize="18sp"
                                  android:textStyle="bold" />
          
                              <TextView
                                  android:layout_width="wrap_content"
                                  android:layout_height="wrap_content"
                                  android:text=" of daily goal"
                                  android:textColor="@color/white_alpha_80"
                                  android:textSize="14sp"
                                  android:layout_marginStart="4dp" />
          
                              <View
                                  android:layout_width="0dp"
                                  android:layout_height="1dp"
                                  android:layout_weight="1" />
          
                              <TextView
                                  android:id="@+id/tv_daily_goal"
                                  android:layout_width="wrap_content"
                                  android:layout_height="wrap_content"
                                  android:text="Daily Goal $32,000"
                                  android:textColor="@color/white_alpha_80"
                                  android:textSize="12sp" />
                          </LinearLayout>
          
                          <ProgressBar
                              android:id="@+id/progress_daily_goal"
                              style="?android:attr/progressBarStyleHorizontal"
                              android:layout_width="match_parent"
                              android:layout_height="6dp"
                              android:layout_marginTop="12dp"
                              android:progress="0"
                              android:progressTint="@color/white"
                              android:progressBackgroundTint="@color/white_alpha_30" />
                      </LinearLayout>
                  </androidx.cardview.widget.CardView>
          
                  <!-- Emotion Timeline -->
                  <LinearLayout
                      android:layout_width="match_parent"
                      android:layout_height="wrap_content"
                      android:orientation="vertical"
                      android:layout_marginBottom="16dp">
          
                      <TextView
                          android:layout_width="wrap_content"
                          android:layout_height="wrap_content"
                          android:text="Emotion Timeline"
                          android:textSize="16sp"
                          android:textStyle="bold"
                          android:textColor="@color/dark"
                          android:layout_marginBottom="12dp" />
          
                      <LinearLayout
                          android:layout_width="match_parent"
                          android:layout_height="wrap_content"
                          android:orientation="horizontal"
                          android:gravity="center_vertical"
                          android:background="@color/white"
                          android:padding="16dp"
                          android:elevation="2dp">
          
                          <View
                              android:layout_width="0dp"
                              android:layout_height="1dp"
                              android:layout_weight="1"
                              android:background="@color/gray_light" />
          
                          <ImageView
                              android:layout_width="32dp"
                              android:layout_height="32dp"
                              android:src="@drawable/ic_emotion_sleep"
                              android:layout_marginHorizontal="2dp" />
          
                          <ImageView
                              android:layout_width="32dp"
                              android:layout_height="32dp"
                              android:src="@drawable/ic_emotion_neutral"
                              android:layout_marginHorizontal="2dp" />
          
                          <ImageView
                              android:layout_width="32dp"
                              android:layout_height="32dp"
                              android:src="@drawable/ic_emotion_happy"
                              android:layout_marginHorizontal="2dp" />
          
                          <ImageView
                              android:layout_width="32dp"
                              android:layout_height="32dp"
                              android:src="@drawable/ic_emotion_excited"
                              android:layout_marginHorizontal="2dp" />
          
                          <ImageView
                              android:layout_width="32dp"
                              android:layout_height="32dp"
                              android:src="@drawable/ic_emotion_happy"
                              android:layout_marginHorizontal="2dp" />
          
                          <ImageView
                              android:layout_width="32dp"
                              android:layout_height="32dp"
                              android:src="@drawable/ic_emotion_neutral"
                              android:layout_marginHorizontal="2dp" />
          
                          <ImageView
                              android:layout_width="32dp"
                              android:layout_height="32dp"
                              android:src="@drawable/ic_emotion_sleep"
                              android:layout_marginHorizontal="2dp" />
          
                          <View
                              android:layout_width="0dp"
                              android:layout_height="1dp"
                              android:layout_weight="1"
                              android:background="@color/gray_light" />
          
                      </LinearLayout>
          
                      <LinearLayout
                          android:layout_width="match_parent"
                          android:layout_height="wrap_content"
                          android:orientation="horizontal"
                          android:paddingHorizontal="16dp"
                          android:layout_marginTop="4dp">
          
                          <TextView
                              android:layout_width="0dp"
                              android:layout_height="wrap_content"
                              android:layout_weight="1"
                              android:text="12 AM"
                              android:textSize="10sp"
                              android:textColor="@color/gray" />
          
                          <TextView
                              android:layout_width="0dp"
                              android:layout_height="wrap_content"
                              android:layout_weight="1"
                              android:text="4 AM"
                              android:textSize="10sp"
                              android:textColor="@color/gray"
                              android:gravity="center" />
          
                          <TextView
                              android:layout_width="0dp"
                              android:layout_height="wrap_content"
                              android:layout_weight="1"
                              android:text="8 AM"
                              android:textSize="10sp"
                              android:textColor="@color/gray"
                              android:gravity="center" />
          
                          <TextView
                              android:layout_width="0dp"
                              android:layout_height="wrap_content"
                              android:layout_weight="1"
                              android:text="12 PM"
                              android:textSize="10sp"
                              android:textColor="@color/gray"
                              android:gravity="center" />
          
                          <TextView
                              android:layout_width="0dp"
                              android:layout_height="wrap_content"
                              android:layout_weight="1"
                              android:text="4 PM"
                              android:textSize="10sp"
                              android:textColor="@color/gray"
                              android:gravity="center" />
          
                          <TextView
                              android:layout_width="0dp"
                              android:layout_height="wrap_content"
                              android:layout_weight="1"
                              android:text="8 PM"
                              android:textSize="10sp"
                              android:textColor="@color/gray"
                              android:gravity="center" />
          
                          <TextView
                              android:layout_width="0dp"
                              android:layout_height="wrap_content"
                              android:layout_weight="1"
                              android:text="12 AM"
                              android:textSize="10sp"
                              android:textColor="@color/gray"
                              android:gravity="end" />
                      </LinearLayout>
                  </LinearLayout>
          
                  <!-- Top Product Today -->
                  <androidx.cardview.widget.CardView
                      android:layout_width="match_parent"
                      android:layout_height="wrap_content"
                      app:cardCornerRadius="16dp"
                      app:cardElevation="2dp"
                      app:cardBackgroundColor="@color/white"
                      android:layout_marginBottom="12dp">
          
                      <LinearLayout
                          android:layout_width="match_parent"
                          android:layout_height="wrap_content"
                          android:orientation="horizontal"
                          android:padding="16dp"
                          android:gravity="center_vertical">
          
                          <LinearLayout
                              android:layout_width="0dp"
                              android:layout_height="wrap_content"
                              android:layout_weight="1"
                              android:orientation="vertical">
          
                              <TextView
                                  android:layout_width="wrap_content"
                                  android:layout_height="wrap_content"
                                  android:text="Top Product Today"
                                  android:textSize="14sp"
                                  android:textColor="@color/gray"
                                  android:fontFamily="sans-serif-medium" />
          
                              <TextView
                                  android:id="@+id/tv_top_product_name"
                                  android:layout_width="wrap_content"
                                  android:layout_height="wrap_content"
                                  android:text="No sales yet"
                                  android:textSize="18sp"
                                  android:textStyle="bold"
                                  android:textColor="@color/dark"
                                  android:layout_marginTop="4dp" />
          
                              <LinearLayout
                                  android:layout_width="wrap_content"
                                  android:layout_height="wrap_content"
                                  android:orientation="horizontal"
                                  android:layout_marginTop="4dp">
          
                                  <TextView
                                      android:id="@+id/tv_top_product_revenue"
                                      android:layout_width="wrap_content"
                                      android:layout_height="wrap_content"
                                      android:text="$0"
                                      android:textSize="16sp"
                                      android:textStyle="bold"
                                      android:textColor="@color/primary" />
          
                                  <TextView
                                      android:id="@+id/tv_top_product_quantity"
                                      android:layout_width="wrap_content"
                                      android:layout_height="wrap_content"
                                      android:text="0 sold"
                                      android:textSize="14sp"
                                      android:textColor="@color/gray"
                                      android:layout_marginStart="8dp" />
                              </LinearLayout>
                          </LinearLayout>
          
                          <ImageView
                              android:layout_width="56dp"
                              android:layout_height="56dp"
                              android:src="@drawable/ic_product"
                              android:background="@color/primary_light"
                              android:padding="12dp"
                              android:scaleType="centerInside" />
                      </LinearLayout>
                  </androidx.cardview.widget.CardView>
          
                  <!-- Pending Orders + Conversion Rate -->
                  <LinearLayout
                      android:layout_width="match_parent"
                      android:layout_height="wrap_content"
                      android:orientation="horizontal"
                      android:layout_marginBottom="16dp">
          
                      <androidx.cardview.widget.CardView
                          android:layout_width="0dp"
                          android:layout_height="100dp"
                          android:layout_weight="1"
                          android:layout_marginEnd="6dp"
                          app:cardCornerRadius="16dp"
                          app:cardElevation="2dp"
                          app:cardBackgroundColor="@color/white">
          
                          <LinearLayout
                              android:layout_width="match_parent"
                              android:layout_height="match_parent"
                              android:orientation="vertical"
                              android:padding="16dp"
                              android:gravity="center_vertical">
          
                              <TextView
                                  android:layout_width="wrap_content"
                                  android:layout_height="wrap_content"
                                  android:text="Pending Orders"
                                  android:textSize="12sp"
                                  android:textColor="@color/gray" />
          
                              <TextView
                                  android:id="@+id/tv_pending_orders"
                                  android:layout_width="wrap_content"
                                  android:layout_height="wrap_content"
                                  android:text="0"
                                  android:textSize="28sp"
                                  android:textStyle="bold"
                                  android:textColor="@color/warning" />
          
                              <TextView
                                  android:layout_width="wrap_content"
                                  android:layout_height="wrap_content"
                                  android:text="Orders"
                                  android:textSize="10sp"
                                  android:textColor="@color/gray" />
          
                              <TextView
                                  android:layout_width="wrap_content"
                                  android:layout_height="wrap_content"
                                  android:text="View all →"
                                  android:textSize="10sp"
                                  android:textColor="@color/primary"
                                  android:layout_marginTop="4dp" />
                          </LinearLayout>
                      </androidx.cardview.widget.CardView>
          
                      <androidx.cardview.widget.CardView
                          android:layout_width="0dp"
                          android:layout_height="100dp"
                          android:layout_weight="1"
                          android:layout_marginStart="6dp"
                          app:cardCornerRadius="16dp"
                          app:cardElevation="2dp"
                          app:cardBackgroundColor="@color/white">
          
                          <LinearLayout
                              android:layout_width="match_parent"
                              android:layout_height="match_parent"
                              android:orientation="vertical"
                              android:padding="16dp"
                              android:gravity="center_vertical">
          
                              <LinearLayout
                                  android:layout_width="match_parent"
                                  android:layout_height="wrap_content"
                                  android:orientation="horizontal"
                                  android:gravity="center_vertical">
          
                                  <TextView
                                      android:layout_width="0dp"
                                      android:layout_height="wrap_content"
                                      android:layout_weight="1"
                                      android:text="Conversion Rate"
                                      android:textSize="12sp"
                                      android:textColor="@color/gray" />
          
                                  <TextView
                                      android:id="@+id/tv_conversion_trend"
                                      android:layout_width="wrap_content"
                                      android:layout_height="wrap_content"
                                      android:text="↑ 0.0%"
                                      android:textSize="10sp"
                                      android:textColor="@color/success"
                                      android:background="@color/success_light"
                                      android:paddingHorizontal="6dp"
                                      android:paddingVertical="2dp"
                                      android:gravity="center" />
                              </LinearLayout>
          
                              <TextView
                                  android:id="@+id/tv_conversion_rate"
                                  android:layout_width="wrap_content"
                                  android:layout_height="wrap_content"
                                  android:text="0.0%"
                                  android:textSize="28sp"
                                  android:textStyle="bold"
                                  android:textColor="@color/dark" />
          
                              <TextView
                                  android:layout_width="wrap_content"
                                  android:layout_height="wrap_content"
                                  android:text="Good"
                                  android:textSize="12sp"
                                  android:textColor="@color/success"
                                  android:fontFamily="sans-serif-medium" />
                          </LinearLayout>
                      </androidx.cardview.widget.CardView>
                  </LinearLayout>
          
              </LinearLayout>
          </ScrollView>
          EOF

      - name: Create Ventas Layout (New Sale) - CORREGIDO
        run: |
          cd android-app
          cat > app/src/main/res/layout/fragment_ventas.xml << 'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <LinearLayout xmlns:android="http://schemas.android.com/apk/res/android"
              xmlns:app="http://schemas.android.com/apk/res-auto"
              android:layout_width="match_parent"
              android:layout_height="match_parent"
              android:orientation="vertical"
              android:background="@color/white"
              android:padding="16dp">
          
              <!-- Header -->
              <LinearLayout
                  android:layout_width="match_parent"
                  android:layout_height="wrap_content"
                  android:orientation="horizontal"
                  android:gravity="center_vertical"
                  android:layout_marginBottom="16dp">
          
                  <TextView
                      android:layout_width="0dp"
                      android:layout_height="wrap_content"
                      android:layout_weight="1"
                      android:text="New Sale"
                      android:textSize="24sp"
                      android:textStyle="bold"
                      android:textColor="@color/dark" />
          
                  <TextView
                      android:id="@+id/tv_pendientes_count"
                      android:layout_width="wrap_content"
                      android:layout_height="wrap_content"
                      android:text="0 pendientes"
                      android:textSize="12sp"
                      android:textColor="@color/warning"
                      android:background="@color/warning_light"
                      android:paddingHorizontal="12dp"
                      android:paddingVertical="4dp"
                      android:visibility="gone" />
              </LinearLayout>
          
              <!-- Search Bar -->
              <com.google.android.material.card.MaterialCardView
                  android:layout_width="match_parent"
                  android:layout_height="wrap_content"
                  app:cardCornerRadius="12dp"
                  app:cardElevation="2dp"
                  app:cardBackgroundColor="@color/light_gray"
                  android:layout_marginBottom="16dp">
          
                  <LinearLayout
                      android:layout_width="match_parent"
                      android:layout_height="wrap_content"
                      android:orientation="horizontal"
                      android:padding="12dp"
                      android:gravity="center_vertical">
          
                      <ImageView
                          android:layout_width="24dp"
                          android:layout_height="24dp"
                          android:src="@drawable/ic_search"
                          android:tint="@color/gray" />
          
                      <EditText
                          android:id="@+id/et_search_product"
                          android:layout_width="0dp"
                          android:layout_height="wrap_content"
                          android:layout_weight="1"
                          android:hint="Search product..."
                          android:background="@android:color/transparent"
                          android:padding="8dp"
                          android:textSize="16sp" />
          
                      <ImageView
                          android:layout_width="24dp"
                          android:layout_height="24dp"
                          android:src="@drawable/ic_mic"
                          android:tint="@color/gray" />
                  </LinearLayout>
              </com.google.android.material.card.MaterialCardView>
          
              <!-- Popular Suggestions -->
              <TextView
                  android:layout_width="wrap_content"
                  android:layout_height="wrap_content"
                  android:text="Popular suggestions"
                  android:textSize="14sp"
                  android:textColor="@color/gray"
                  android:layout_marginBottom="12dp" />
          
              <HorizontalScrollView
                  android:layout_width="match_parent"
                  android:layout_height="wrap_content"
                  android:scrollbars="none"
                  android:layout_marginBottom="16dp">
          
                  <LinearLayout
                      android:layout_width="wrap_content"
                      android:layout_height="wrap_content"
                      android:orientation="horizontal">
          
                      <com.google.android.material.chip.Chip
                          android:id="@+id/chip_blue_jeans"
                          android:layout_width="wrap_content"
                          android:layout_height="wrap_content"
                          android:text="Blue Jeans"
                          app:chipBackgroundColor="@color/primary"
                          android:textColor="@color/white"
                          android:layout_marginEnd="8dp" />
          
                      <com.google.android.material.chip.Chip
                          android:id="@+id/chip_red_tshirt"
                          android:layout_width="wrap_content"
                          android:layout_height="wrap_content"
                          android:text="Red T-Shirt"
                          app:chipBackgroundColor="@color/light_gray"
                          android:textColor="@color/dark"
                          android:layout_marginEnd="8dp" />
          
                      <com.google.android.material.chip.Chip
                          android:id="@+id/chip_sneakers"
                          android:layout_width="wrap_content"
                          android:layout_height="wrap_content"
                          android:text="Sneakers"
                          app:chipBackgroundColor="@color/light_gray"
                          android:textColor="@color/dark"
                          android:layout_marginEnd="8dp" />
          
                      <com.google.android.material.chip.Chip
                          android:id="@+id/chip_hoodie"
                          android:layout_width="wrap_content"
                          android:layout_height="wrap_content"
                          android:text="Hoodie"
                          app:chipBackgroundColor="@color/light_gray"
                          android:textColor="@color/dark" />
                  </LinearLayout>
              </HorizontalScrollView>
          
              <!-- Live Total Card -->
              <com.google.android.material.card.MaterialCardView
                  android:layout_width="match_parent"
                  android:layout_height="wrap_content"
                  app:cardCornerRadius="16dp"
                  app:cardElevation="4dp"
                  app:cardBackgroundColor="@color/primary"
                  android:layout_marginBottom="16dp">
          
                  <LinearLayout
                      android:layout_width="match_parent"
                      android:layout_height="wrap_content"
                      android:orientation="vertical"
                      android:padding="16dp">
          
                      <LinearLayout
                          android:layout_width="match_parent"
                          android:layout_height="wrap_content"
                          android:orientation="horizontal"
                          android:gravity="center_vertical">
          
                          <TextView
                              android:layout_width="0dp"
                              android:layout_height="wrap_content"
                              android:layout_weight="1"
                              android:text="LIVE TOTAL"
                              android:textColor="@color/white_alpha_80"
                              android:textSize="12sp"
                              android:letterSpacing="0.1" />
          
                          <LinearLayout
                              android:layout_width="wrap_content"
                              android:layout_height="wrap_content"
                              android:orientation="horizontal"
                              android:gravity="center_vertical"
                              android:background="@color/white_alpha_20"
                              android:paddingHorizontal="8dp"
                              android:paddingVertical="4dp">
          
                              <View
                                  android:layout_width="6dp"
                                  android:layout_height="6dp"
                                  android:background="@drawable/bg_pulse"
                                  android:layout_marginEnd="4dp" />
          
                              <TextView
                                  android:id="@+id/tv_live_percent"
                                  android:layout_width="wrap_content"
                                  android:layout_height="wrap_content"
                                  android:text="+0%"
                                  android:textColor="@color/white"
                                  android:textSize="12sp"
                                  android:textStyle="bold" />
          
                              <TextView
                                  android:layout_width="wrap_content"
                                  android:layout_height="wrap_content"
                                  android:text="vs last sale"
                                  android:textColor="@color/white_alpha_80"
                                  android:textSize="10sp" />
                          </LinearLayout>
                      </LinearLayout>
          
                      <TextView
                          android:id="@+id/tv_live_total"
                          android:layout_width="wrap_content"
                          android:layout_height="wrap_content"
                          android:text="$0.00"
                          android:textColor="@color/white"
                          android:textSize="36sp"
                          android:textStyle="bold"
                          android:layout_marginTop="8dp" />
                  </LinearLayout>
              </com.google.android.material.card.MaterialCardView>
          
              <!-- Product Details -->
              <com.google.android.material.card.MaterialCardView
                  android:layout_width="match_parent"
                  android:layout_height="0dp"
                  android:layout_weight="1"
                  app:cardCornerRadius="16dp"
                  app:cardElevation="2dp"
                  app:cardBackgroundColor="@color/white"
                  android:layout_marginBottom="16dp">
          
                  <ScrollView
                      android:layout_width="match_parent"
                      android:layout_height="match_parent"
                      android:fillViewport="true">
          
                      <LinearLayout
                          android:layout_width="match_parent"
                          android:layout_height="wrap_content"
                          android:orientation="vertical"
                          android:padding="16dp">
          
                          <!-- Product Image Placeholder -->
                          <View
                              android:layout_width="match_parent"
                              android:layout_height="120dp"
                              android:background="@color/primary_light"
                              android:layout_marginBottom="12dp" />
          
                          <!-- Product Name -->
                          <TextView
                              android:id="@+id/tv_product_name"
                              android:layout_width="wrap_content"
                              android:layout_height="wrap_content"
                              android:text="Select a product"
                              android:textSize="20sp"
                              android:textStyle="bold"
                              android:textColor="@color/dark" />
          
                          <TextView
                              android:id="@+id/tv_product_description"
                              android:layout_width="wrap_content"
                              android:layout_height="wrap_content"
                              android:text=""
                              android:textSize="14sp"
                              android:textColor="@color/gray"
                              android:layout_marginBottom="12dp" />
          
                          <!-- Price and Quantity Row -->
                          <LinearLayout
                              android:layout_width="match_parent"
                              android:layout_height="wrap_content"
                              android:orientation="horizontal"
                              android:layout_marginBottom="12dp">
          
                              <LinearLayout
                                  android:layout_width="0dp"
                                  android:layout_height="wrap_content"
                                  android:layout_weight="1"
                                  android:orientation="vertical">
          
                                  <TextView
                                      android:layout_width="wrap_content"
                                      android:layout_height="wrap_content"
                                      android:text="Unit Price"
                                      android:textSize="12sp"
                                      android:textColor="@color/gray" />
          
                                  <TextView
                                      android:id="@+id/tv_unit_price"
                                      android:layout_width="wrap_content"
                                      android:layout_height="wrap_content"
                                      android:text="$0.00"
                                      android:textSize="18sp"
                                      android:textStyle="bold"
                                      android:textColor="@color/dark" />
                              </LinearLayout>
          
                              <LinearLayout
                                  android:layout_width="0dp"
                                  android:layout_height="wrap_content"
                                  android:layout_weight="1"
                                  android:orientation="vertical">
          
                                  <TextView
                                      android:layout_width="wrap_content"
                                      android:layout_height="wrap_content"
                                      android:text="Quantity"
                                      android:textSize="12sp"
                                      android:textColor="@color/gray" />
          
                                  <LinearLayout
                                      android:layout_width="wrap_content"
                                      android:layout_height="wrap_content"
                                      android:orientation="horizontal"
                                      android:gravity="center_vertical">
          
                                      <ImageView
                                          android:id="@+id/btn_decrease_qty"
                                          android:layout_width="32dp"
                                          android:layout_height="32dp"
                                          android:src="@drawable/ic_minus"
                                          android:padding="4dp"
                                          android:background="?attr/selectableItemBackgroundBorderless"
                                          android:tint="@color/primary" />
          
                                      <TextView
                                          android:id="@+id/tv_quantity"
                                          android:layout_width="wrap_content"
                                          android:layout_height="wrap_content"
                                          android:text="1"
                                          android:textSize="18sp"
                                          android:textStyle="bold"
                                          android:textColor="@color/dark"
                                          android:minWidth="32dp"
                                          android:gravity="center" />
          
                                      <ImageView
                                          android:id="@+id/btn_increase_qty"
                                          android:layout_width="32dp"
                                          android:layout_height="32dp"
                                          android:src="@drawable/ic_plus"
                                          android:padding="4dp"
                                          android:background="?attr/selectableItemBackgroundBorderless"
                                          android:tint="@color/primary" />
                                  </LinearLayout>
                              </LinearLayout>
                          </LinearLayout>
          
                          <!-- Discount and Subtotal -->
                          <LinearLayout
                              android:layout_width="match_parent"
                              android:layout_height="wrap_content"
                              android:orientation="horizontal"
                              android:layout_marginBottom="8dp">
          
                              <TextView
                                  android:layout_width="0dp"
                                  android:layout_height="wrap_content"
                                  android:layout_weight="1"
                                  android:text="Discount"
                                  android:textSize="14sp"
                                  android:textColor="@color/gray" />
          
                              <TextView
                                  android:id="@+id/tv_discount"
                                  android:layout_width="wrap_content"
                                  android:layout_height="wrap_content"
                                  android:text="$0.00"
                                  android:textSize="14sp"
                                  android:textColor="@color/dark"
                                  android:textStyle="bold" />
                          </LinearLayout>
          
                          <LinearLayout
                              android:layout_width="match_parent"
                              android:layout_height="wrap_content"
                              android:orientation="horizontal"
                              android:layout_marginBottom="8dp">
          
                              <TextView
                                  android:layout_width="0dp"
                                  android:layout_height="wrap_content"
                                  android:layout_weight="1"
                                  android:text="Subtotal"
                                  android:textSize="14sp"
                                  android:textColor="@color/gray" />
          
                              <TextView
                                  android:id="@+id/tv_subtotal"
                                  android:layout_width="wrap_content"
                                  android:layout_height="wrap_content"
                                  android:text="$0.00"
                                  android:textSize="14sp"
                                  android:textColor="@color/dark"
                                  android:textStyle="bold" />
                          </LinearLayout>
          
                          <!-- Haptic Feedback -->
                          <LinearLayout
                              android:layout_width="match_parent"
                              android:layout_height="wrap_content"
                              android:orientation="horizontal"
                              android:gravity="center_vertical"
                              android:layout_marginTop="8dp"
                              android:layout_marginBottom="16dp">
          
                              <TextView
                                  android:layout_width="0dp"
                                  android:layout_height="wrap_content"
                                  android:layout_weight="1"
                                  android:text="Haptic Feedback"
                                  android:textSize="14sp"
                                  android:textColor="@color/dark" />
          
                              <androidx.appcompat.widget.SwitchCompat
                                  android:id="@+id/switch_haptic"
                                  android:layout_width="wrap_content"
                                  android:layout_height="wrap_content"
                                  android:checked="true" />
                          </LinearLayout>
          
                          <!-- Confirm Sale Button -->
                          <Button
                              android:id="@+id/btn_confirm_sale"
                              android:layout_width="match_parent"
                              android:layout_height="56dp"
                              android:text="Confirm Sale"
                              android:textSize="16sp"
                              android:textStyle="bold"
                              android:textColor="@color/white"
                              android:background="@drawable/bg_button_login"
                              android:elevation="4dp" />
                      </LinearLayout>
                  </ScrollView>
              </com.google.android.material.card.MaterialCardView>
          
          </LinearLayout>
          EOF

      - name: Create Inventario Layout - CORREGIDO
        run: |
          cd android-app
          cat > app/src/main/res/layout/fragment_inventario.xml << 'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <LinearLayout xmlns:android="http://schemas.android.com/apk/res/android"
              xmlns:app="http://schemas.android.com/apk/res-auto"
              android:layout_width="match_parent"
              android:layout_height="match_parent"
              android:orientation="vertical"
              android:background="@color/white">
          
              <!-- Header -->
              <LinearLayout
                  android:layout_width="match_parent"
                  android:layout_height="wrap_content"
                  android:orientation="horizontal"
                  android:gravity="center_vertical"
                  android:padding="16dp"
                  android:paddingTop="20dp">
          
                  <TextView
                      android:layout_width="0dp"
                      android:layout_height="wrap_content"
                      android:layout_weight="1"
                      android:text="Inventory"
                      android:textSize="24sp"
                      android:textStyle="bold"
                      android:textColor="@color/dark" />
          
                  <ImageView
                      android:id="@+id/btn_scan"
                      android:layout_width="40dp"
                      android:layout_height="40dp"
                      android:src="@drawable/ic_scan"
                      android:padding="8dp"
                      android:background="@drawable/bg_scan" />
              </LinearLayout>
          
              <!-- Stats -->
              <LinearLayout
                  android:layout_width="match_parent"
                  android:layout_height="wrap_content"
                  android:orientation="horizontal"
                  android:paddingHorizontal="16dp"
                  android:layout_marginBottom="12dp">
          
                  <TextView
                      android:id="@+id/tv_stats_products"
                      android:layout_width="0dp"
                      android:layout_height="wrap_content"
                      android:layout_weight="1"
                      android:text="0 Products ·"
                      android:textSize="14sp"
                      android:textColor="@color/gray" />
          
                  <TextView
                      android:id="@+id/tv_updated_now"
                      android:layout_width="wrap_content"
                      android:layout_height="wrap_content"
                      android:text="Updated now"
                      android:textSize="12sp"
                      android:textColor="@color/success" />
              </LinearLayout>
          
              <!-- Category Tabs -->
              <HorizontalScrollView
                  android:layout_width="match_parent"
                  android:layout_height="wrap_content"
                  android:scrollbars="none"
                  android:paddingHorizontal="16dp"
                  android:layout_marginBottom="16dp">
          
                  <LinearLayout
                      android:layout_width="wrap_content"
                      android:layout_height="wrap_content"
                      android:orientation="horizontal">
          
                      <com.google.android.material.chip.Chip
                          android:id="@+id/chip_all"
                          android:layout_width="wrap_content"
                          android:layout_height="wrap_content"
                          android:text="All"
                          app:chipBackgroundColor="@color/primary"
                          android:textColor="@color/white"
                          android:layout_marginEnd="8dp" />
          
                      <com.google.android.material.chip.Chip
                          android:id="@+id/chip_low_stock"
                          android:layout_width="wrap_content"
                          android:layout_height="wrap_content"
                          android:text="Low Stock"
                          app:chipBackgroundColor="@color/light_gray"
                          android:textColor="@color/dark"
                          android:layout_marginEnd="8dp" />
          
                      <com.google.android.material.chip.Chip
                          android:id="@+id/chip_electronics"
                          android:layout_width="wrap_content"
                          android:layout_height="wrap_content"
                          android:text="Electronics"
                          app:chipBackgroundColor="@color/light_gray"
                          android:textColor="@color/dark"
                          android:layout_marginEnd="8dp" />
          
                      <com.google.android.material.chip.Chip
                          android:id="@+id/chip_clothing"
                          android:layout_width="wrap_content"
                          android:layout_height="wrap_content"
                          android:text="Clothing"
                          app:chipBackgroundColor="@color/light_gray"
                          android:textColor="@color/dark" />
                  </LinearLayout>
              </HorizontalScrollView>
          
              <!-- Products Grid -->
              <androidx.recyclerview.widget.RecyclerView
                  android:id="@+id/rv_inventario"
                  android:layout_width="match_parent"
                  android:layout_height="0dp"
                  android:layout_weight="1"
                  android:paddingHorizontal="12dp"
                  android:paddingBottom="8dp"
                  android:clipToPadding="false" />
          
              <TextView
                  android:id="@+id/tv_inventario_vacio"
                  android:layout_width="match_parent"
                  android:layout_height="match_parent"
                  android:text="No hay productos en el inventario"
                  android:textSize="14sp"
                  android:textColor="@color/gray"
                  android:gravity="center"
                  android:padding="32dp"
                  android:visibility="gone" />
          
          </LinearLayout>
          EOF

      - name: Create Usuario Layout (Profile)
        run: |
          cd android-app
          cat > app/src/main/res/layout/fragment_usuario.xml << 'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <ScrollView xmlns:android="http://schemas.android.com/apk/res/android"
              xmlns:app="http://schemas.android.com/apk/res-auto"
              android:layout_width="match_parent"
              android:layout_height="match_parent"
              android:background="@color/white"
              android:fillViewport="true">
          
              <LinearLayout
                  android:layout_width="match_parent"
                  android:layout_height="wrap_content"
                  android:orientation="vertical"
                  android:padding="16dp">
          
                  <!-- Header -->
                  <LinearLayout
                      android:layout_width="match_parent"
                      android:layout_height="wrap_content"
                      android:orientation="horizontal"
                      android:gravity="center_vertical"
                      android:layout_marginBottom="20dp">
          
                      <TextView
                          android:layout_width="0dp"
                          android:layout_height="wrap_content"
                          android:layout_weight="1"
                          android:text="Seller Profile"
                          android:textSize="24sp"
                          android:textStyle="bold"
                          android:textColor="@color/dark" />
          
                      <ImageView
                          android:layout_width="40dp"
                          android:layout_height="40dp"
                          android:src="@drawable/ic_settings"
                          android:padding="8dp"
                          android:background="?attr/selectableItemBackgroundBorderless" />
                  </LinearLayout>
          
                  <!-- Profile Card -->
                  <com.google.android.material.card.MaterialCardView
                      android:layout_width="match_parent"
                      android:layout_height="wrap_content"
                      app:cardCornerRadius="16dp"
                      app:cardElevation="4dp"
                      app:cardBackgroundColor="@color/primary"
                      android:layout_marginBottom="16dp">
          
                      <LinearLayout
                          android:layout_width="match_parent"
                          android:layout_height="wrap_content"
                          android:orientation="vertical"
                          android:padding="20dp">
          
                          <LinearLayout
                              android:layout_width="match_parent"
                              android:layout_height="wrap_content"
                              android:orientation="horizontal"
                              android:gravity="center_vertical">
          
                              <ImageView
                                  android:layout_width="56dp"
                                  android:layout_height="56dp"
                                  android:src="@drawable/ic_user"
                                  android:tint="@color/white"
                                  android:background="@drawable/bg_avatar_white"
                                  android:padding="12dp" />
          
                              <LinearLayout
                                  android:layout_width="0dp"
                                  android:layout_height="wrap_content"
                                  android:layout_weight="1"
                                  android:orientation="vertical"
                                  android:layout_marginStart="12dp">
          
                                  <TextView
                                      android:id="@+id/tv_vendor_name"
                                      android:layout_width="wrap_content"
                                      android:layout_height="wrap_content"
                                      android:text="Vendor"
                                      android:textColor="@color/white"
                                      android:textSize="20sp"
                                      android:textStyle="bold" />
          
                                  <TextView
                                      android:layout_width="wrap_content"
                                      android:layout_height="wrap_content"
                                      android:text="Top Seller"
                                      android:textColor="@color/white_alpha_80"
                                      android:textSize="14sp" />
                              </LinearLayout>
          
                              <ImageView
                                  android:layout_width="32dp"
                                  android:layout_height="32dp"
                                  android:src="@drawable/ic_star"
                                  android:tint="@color/warning" />
                          </LinearLayout>
          
                          <TextView
                              android:id="@+id/tv_vendor_category"
                              android:layout_width="wrap_content"
                              android:layout_height="wrap_content"
                              android:text="Electronics"
                              android:textColor="@color/white_alpha_80"
                              android:textSize="14sp"
                              android:layout_marginTop="8dp" />
          
                          <!-- Monthly Goal -->
                          <LinearLayout
                              android:layout_width="match_parent"
                              android:layout_height="wrap_content"
                              android:orientation="vertical"
                              android:layout_marginTop="12dp">
          
                              <LinearLayout
                                  android:layout_width="match_parent"
                                  android:layout_height="wrap_content"
                                  android:orientation="horizontal">
          
                                  <TextView
                                      android:layout_width="0dp"
                                      android:layout_height="wrap_content"
                                      android:layout_weight="1"
                                      android:text="Monthly Goal"
                                      android:textColor="@color/white_alpha_80"
                                      android:textSize="12sp" />
          
                                  <TextView
                                      android:id="@+id/tv_monthly_goal"
                                      android:layout_width="wrap_content"
                                      android:layout_height="wrap_content"
                                      android:text="$0/$0"
                                      android:textColor="@color/white"
                                      android:textSize="14sp"
                                      android:textStyle="bold" />
                              </LinearLayout>
          
                              <ProgressBar
                                  android:id="@+id/progress_monthly_goal"
                                  style="?android:attr/progressBarStyleHorizontal"
                                  android:layout_width="match_parent"
                                  android:layout_height="6dp"
                                  android:layout_marginTop="8dp"
                                  android:progress="0"
                                  android:progressTint="@color/white"
                                  android:progressBackgroundTint="@color/white_alpha_30" />
                          </LinearLayout>
                      </LinearLayout>
                  </com.google.android.material.card.MaterialCardView>
          
                  <!-- Achievements -->
                  <TextView
                      android:layout_width="wrap_content"
                      android:layout_height="wrap_content"
                      android:text="Achievements"
                      android:textSize="16sp"
                      android:textStyle="bold"
                      android:textColor="@color/dark"
                      android:layout_marginBottom="12dp" />
          
                  <LinearLayout
                      android:layout_width="match_parent"
                      android:layout_height="wrap_content"
                      android:orientation="horizontal"
                      android:layout_marginBottom="16dp">
          
                      <com.google.android.material.card.MaterialCardView
                          android:layout_width="0dp"
                          android:layout_height="80dp"
                          android:layout_weight="1"
                          android:layout_marginEnd="6dp"
                          app:cardCornerRadius="12dp"
                          app:cardElevation="2dp"
                          app:cardBackgroundColor="@color/primary_light">
          
                          <LinearLayout
                              android:layout_width="match_parent"
                              android:layout_height="match_parent"
                              android:orientation="vertical"
                              android:gravity="center">
          
                              <TextView
                                  android:layout_width="wrap_content"
                                  android:layout_height="wrap_content"
                                  android:text="TOP"
                                  android:textSize="20sp"
                                  android:textStyle="bold"
                                  android:textColor="@color/primary" />
          
                              <TextView
                                  android:layout_width="wrap_content"
                                  android:layout_height="wrap_content"
                                  android:text="PERFORMER"
                                  android:textSize="8sp"
                                  android:textColor="@color/primary" />
                          </LinearLayout>
                      </com.google.android.material.card.MaterialCardView>
          
                      <com.google.android.material.card.MaterialCardView
                          android:layout_width="0dp"
                          android:layout_height="80dp"
                          android:layout_weight="1"
                          android:layout_marginHorizontal="6dp"
                          app:cardCornerRadius="12dp"
                          app:cardElevation="2dp"
                          app:cardBackgroundColor="@color/warning_light">
          
                          <LinearLayout
                              android:layout_width="match_parent"
                              android:layout_height="match_parent"
                              android:orientation="vertical"
                              android:gravity="center">
          
                              <TextView
                                  android:layout_width="wrap_content"
                                  android:layout_height="wrap_content"
                                  android:text="HIGH"
                                  android:textSize="20sp"
                                  android:textStyle="bold"
                                  android:textColor="@color/warning" />
          
                              <TextView
                                  android:layout_width="wrap_content"
                                  android:layout_height="wrap_content"
                                  android:text="CONVERTER"
                                  android:textSize="8sp"
                                  android:textColor="@color/warning" />
                          </LinearLayout>
                      </com.google.android.material.card.MaterialCardView>
          
                      <com.google.android.material.card.MaterialCardView
                          android:layout_width="0dp"
                          android:layout_height="80dp"
                          android:layout_weight="1"
                          android:layout_marginStart="6dp"
                          app:cardCornerRadius="12dp"
                          app:cardElevation="2dp"
                          app:cardBackgroundColor="@color/success_light">
          
                          <LinearLayout
                              android:layout_width="match_parent"
                              android:layout_height="match_parent"
                              android:orientation="vertical"
                              android:gravity="center">
          
                              <TextView
                                  android:layout_width="wrap_content"
                                  android:layout_height="wrap_content"
                                  android:text="FASTEST"
                                  android:textSize="20sp"
                                  android:textStyle="bold"
                                  android:textColor="@color/success" />
          
                              <TextView
                                  android:layout_width="wrap_content"
                                  android:layout_height="wrap_content"
                                  android:text="SALE"
                                  android:textSize="8sp"
                                  android:textColor="@color/success" />
                          </LinearLayout>
                      </com.google.android.material.card.MaterialCardView>
                  </LinearLayout>
          
                  <!-- Achievements Row 2 -->
                  <LinearLayout
                      android:layout_width="match_parent"
                      android:layout_height="wrap_content"
                      android:orientation="horizontal"
                      android:layout_marginBottom="16dp">
          
                      <com.google.android.material.card.MaterialCardView
                          android:layout_width="0dp"
                          android:layout_height="60dp"
                          android:layout_weight="1"
                          android:layout_marginEnd="6dp"
                          app:cardCornerRadius="12dp"
                          app:cardElevation="2dp"
                          app:cardBackgroundColor="@color/info_light">
          
                          <LinearLayout
                              android:layout_width="match_parent"
                              android:layout_height="match_parent"
                              android:orientation="horizontal"
                              android:gravity="center"
                              android:padding="8dp">
          
                              <TextView
                                  android:layout_width="wrap_content"
                                  android:layout_height="wrap_content"
                                  android:text="MAY"
                                  android:textSize="16sp"
                                  android:textStyle="bold"
                                  android:textColor="@color/info" />
          
                              <TextView
                                  android:layout_width="wrap_content"
                                  android:layout_height="wrap_content"
                                  android:text="15%+"
                                  android:textSize="12sp"
                                  android:textColor="@color/info"
                                  android:layout_marginStart="4dp" />
                          </LinearLayout>
                      </com.google.android.material.card.MaterialCardView>
          
                      <com.google.android.material.card.MaterialCardView
                          android:layout_width="0dp"
                          android:layout_height="60dp"
                          android:layout_weight="1"
                          android:layout_marginStart="6dp"
                          app:cardCornerRadius="12dp"
                          app:cardElevation="2dp"
                          app:cardBackgroundColor="@color/danger_light">
          
                          <LinearLayout
                              android:layout_width="match_parent"
                              android:layout_height="match_parent"
                              android:orientation="horizontal"
                              android:gravity="center"
                              android:padding="8dp">
          
                              <TextView
                                  android:layout_width="wrap_content"
                                  android:layout_height="wrap_content"
                                  android:text="10X"
                                  android:textSize="16sp"
                                  android:textStyle="bold"
                                  android:textColor="@color/danger" />
          
                              <TextView
                                  android:layout_width="wrap_content"
                                  android:layout_height="wrap_content"
                                  android:text="TING"
                                  android:textSize="10sp"
                                  android:textColor="@color/danger"
                                  android:layout_marginStart="4dp" />
                          </LinearLayout>
                      </com.google.android.material.card.MaterialCardView>
                  </LinearLayout>
          
                  <!-- Quote -->
                  <com.google.android.material.card.MaterialCardView
                      android:layout_width="match_parent"
                      android:layout_height="wrap_content"
                      app:cardCornerRadius="12dp"
                      app:cardElevation="2dp"
                      app:cardBackgroundColor="@color/light_gray"
                      android:layout_marginBottom="16dp">
          
                      <TextView
                          android:layout_width="match_parent"
                          android:layout_height="wrap_content"
                          android:text="Discipline today,\nFreedom tomorrow."
                          android:textSize="16sp"
                          android:textStyle="italic"
                          android:textColor="@color/dark"
                          android:gravity="center"
                          android:padding="20dp" />
