name: Build Android APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      # ✅ CREAR el wrapper.properties si no existe
      - name: Create Gradle Wrapper files if missing
        run: |
          cd android-app
          
          # Crear directorio wrapper si no existe
          mkdir -p gradle/wrapper
          
          # Crear gradle-wrapper.properties
          cat > gradle/wrapper/gradle-wrapper.properties << 'EOF'
          distributionBase=GRADLE_USER_HOME
          distributionPath=wrapper/dists
          distributionUrl=https\://services.gradle.org/distributions/gradle-8.2-bin.zip
          zipStoreBase=GRADLE_USER_HOME
          zipStorePath=wrapper/dists
          EOF
          
          # Descargar gradle-wrapper.jar si no existe
          if [ ! -f "gradle/wrapper/gradle-wrapper.jar" ]; then
            curl -L -o gradle/wrapper/gradle-wrapper.jar \
              https://raw.githubusercontent.com/gradle/gradle/v8.2.0/gradle/wrapper/gradle-wrapper.jar
          fi
          
          # Asegurar permisos
          chmod +x gradlew
          
          echo "✅ Wrapper files created successfully"
          ls -la gradle/wrapper/

      # ✅ USAR gradle/actions/setup-gradle para manejar el wrapper
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.2'
          build-root-directory: android-app

      - name: Build Debug APK
        run: |
          cd android-app
          ./gradlew assembleDebug --no-daemon

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: android-app/app/build/outputs/apk/debug/*.apk

      - name: Build Release APK
        run: |
          cd android-app
          ./gradlew assembleRelease --no-daemon

      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: app-release-unsigned
          path: android-app/app/build/outputs/apk/release/*.apk

      # ✅ Firmar solo en main
      - name: Sign Release APK
        if: github.ref == 'refs/heads/main'
        env:
          HAS_KEYSTORE: ${{ secrets.KEYSTORE_BASE64 != '' }}
        run: |
          if [ "$HAS_KEYSTORE" = "true" ]; then
            echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > keystore.jks
            cd android-app
            ./gradlew assembleRelease \
              -Pandroid.injected.signing.store.file=$(pwd)/../keystore.jks \
              -Pandroid.injected.signing.store.password=${{ secrets.KEYSTORE_PASSWORD }} \
              -Pandroid.injected.signing.key.alias=${{ secrets.KEY_ALIAS }} \
              -Pandroid.injected.signing.key.password=${{ secrets.KEY_PASSWORD }}
          else
            echo "⚠️ No se encontraron secrets de firma, saltando..."
          fi

      - name: Upload Signed APK
        if: github.ref == 'refs/heads/main' && secrets.KEYSTORE_BASE64 != ''
        uses: actions/upload-artifact@v4
        with:
          name: app-release-signed
          path: android-app/app/build/outputs/apk/release/*.apk
