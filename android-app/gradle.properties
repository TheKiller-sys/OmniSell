# ============================================
# OMNIVENTAS - Configuración de Gradle
# ============================================
# Versión: 9.0.0
# API: omnisell-x19d.onrender.com
# ============================================

# AndroidX y Jetifier
android.useAndroidX=true
android.enableJetifier=true

# Optimizaciones de Gradle
org.gradle.jvmargs=-Xmx2048m -XX:MaxMetaspaceSize=512m
org.gradle.parallel=true
org.gradle.caching=true

# URL de la API (variable de entorno)
# Se puede sobrescribir en tiempo de compilación:
# ./gradlew assembleDebug -PAPI_URL="https://omnisell-x19d.onrender.com/"
API_URL=https://omnisell-c3uw.onrender.com/

# Optimizaciones de compilación
android.enableR8.fullMode=true
android.enableR8.libraries=true
android.enableResourceOptimizations=true
