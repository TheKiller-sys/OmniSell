<!DOCTYPE html>
<html lang="es" data-bs-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar Sesión - OmniVentas</title>
    
    <!-- Meta Tags -->
    <meta name="description" content="Accede a tu cuenta de OmniVentas y gestiona tu negocio desde cualquier lugar.">
    <meta name="robots" content="noindex, nofollow">
    
    <!-- Favicon -->
    <link rel="icon" type="image/svg+xml" href="{{ url_for('static', filename='favicon.svg') }}">
    <link rel="shortcut icon" href="{{ url_for('static', filename='favicon.svg') }}">
    
    <!-- Bootstrap 5 y Font Awesome -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" rel="stylesheet">
    
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    
    <!-- Estilos -->
    <link rel="stylesheet" href="{{ url_for('static', filename='css/landing.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/auth.css') }}">
</head>
<body class="auth-body">

    <div class="auth-card">
        <!-- Logo -->
        <div class="auth-logo">
            <div class="logo-icon">
                <i class="fas fa-chart-line"></i>
            </div>
            <h2>
                <span class="brand-gradient">OmniVentas</span>
            </h2>
            <p>Bienvenido de nuevo 👋</p>
        </div>

        <!-- Alerts -->
        {% if message %}
        <div class="auth-alert auth-alert-success mb-3">
            <i class="fas fa-check-circle"></i>
            <span>{{ message }}</span>
        </div>
        {% endif %}

        {% if error %}
        <div class="auth-alert auth-alert-danger mb-3">
            <i class="fas fa-exclamation-circle"></i>
            <span>{{ error }}</span>
        </div>
        {% endif %}

        <!-- Form -->
        <form class="auth-form" id="login-form" action="/login" method="post" data-loading>
            <div class="form-group">
                <label class="form-label" for="username">
                    <i class="fas fa-user label-icon"></i>
                    Usuario
                </label>
                <input type="text" 
                       id="username" 
                       name="username" 
                       class="form-control" 
                       placeholder="Ingresa tu usuario"
                       required 
                       autofocus>
                <div class="invalid-feedback">Por favor ingresa tu usuario</div>
            </div>

            <div class="form-group">
                <label class="form-label" for="password">
                    <i class="fas fa-lock label-icon"></i>
                    Contraseña
                </label>
                <div class="position-relative">
                    <input type="password" 
                           id="password" 
                           name="password" 
                           class="form-control" 
                           placeholder="Ingresa tu contraseña"
                           required>
                    <button type="button" 
                            class="toggle-password position-absolute top-50 end-0 translate-middle-y border-0 bg-transparent"
                            data-target="#password"
                            style="right: 12px; color: #94A3B8; padding: 4px 8px; font-size: 1rem;">
                        <i class="fas fa-eye"></i>
                    </button>
                </div>
                <div class="invalid-feedback">Por favor ingresa tu contraseña</div>
            </div>

            <button type="submit" class="btn-primary">
                <span class="btn-text">
                    <i class="fas fa-sign-in-alt"></i>
                    Iniciar Sesión
                </span>
                <span class="spinner"></span>
            </button>
        </form>

        <div class="auth-divider">
            <span>o</span>
        </div>

        <!-- Social Login (Opcional) -->
        <button class="btn-social mb-3" onclick="alert('Próximamente...')">
            <i class="fab fa-google" style="color: #EA4335;"></i>
            Continuar con Google
        </button>

        <!-- Links -->
        <div class="auth-links">
            <p class="text-muted">
                ¿No tienes cuenta? 
                <a href="{{ url_for('signup') }}">Crear cuenta</a>
            </p>
            <p class="mt-2">
                <a href="#" style="font-size: 0.85rem; color: #94A3B8;">¿Olvidaste tu contraseña?</a>
            </p>
            <p class="mt-3" style="font-size: 0.75rem; color: #94A3B8;">
                <i class="fas fa-shield-alt me-1"></i>
                Tus datos están seguros
            </p>
        </div>
    </div>

    <!-- Scripts -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="{{ url_for('static', filename='js/auth.js') }}"></script>
    
    <script>
        // Auto-enfocar el primer campo
        document.addEventListener('DOMContentLoaded', function() {
            const firstInput = document.querySelector('input[autofocus]');
            if (firstInput) {
                setTimeout(() => firstInput.focus(), 100);
            }
        });
    </script>
</body>
</html>
