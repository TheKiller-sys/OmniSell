<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar Sesión - OmniVentas</title>
    
    <!-- Meta Tags -->
    <meta name="description" content="Accede a tu cuenta de OmniVentas y gestiona tu negocio.">
    <meta name="robots" content="noindex, nofollow">
    
    <!-- Favicon -->
    <link rel="icon" type="image/svg+xml" href="{{ url_for('static', filename='favicon.svg') }}">
    
    <!-- Bootstrap 5 y Font Awesome -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" rel="stylesheet">
    
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    
    <!-- Estilos -->
    <link rel="stylesheet" href="{{ url_for('static', filename='css/auth.css') }}">
</head>
<body class="auth-body">

    <div class="auth-card">
        <!-- Logo -->
        <div class="auth-logo">
            <div class="logo-icon">
                <i class="fas fa-chart-line"></i>
            </div>
            <h2>
                <span class="brand-gradient">OmniVentas</span>
            </h2>
            <p>Bienvenido de nuevo 👋</p>
        </div>

        <!-- Alerts -->
        {% if message %}
        <div class="auth-alert auth-alert-success">
            <i class="fas fa-check-circle"></i>
            <span>{{ message }}</span>
        </div>
        {% endif %}

        {% if error %}
        <div class="auth-alert auth-alert-danger">
            <i class="fas fa-exclamation-circle"></i>
            <span>{{ error }}</span>
        </div>
        {% endif %}

        <!-- Form -->
        <form class="auth-form" id="login-form" action="/login" method="post" data-loading>
            <div class="form-group">
                <label class="form-label" for="username">
                    <i class="fas fa-user label-icon"></i>
                    Usuario
                </label>
                <input type="text" 
                       id="username" 
                       name="username" 
                       class="form-control" 
                       placeholder="Ingresa tu usuario"
                       required 
                       autofocus>
                <div class="invalid-feedback">Por favor ingresa tu usuario</div>
            </div>

            <div class="form-group">
                <label class="form-label" for="password">
                    <i class="fas fa-lock label-icon"></i>
                    Contraseña
                </label>
                <div class="position-relative">
                    <input type="password" 
                           id="password" 
                           name="password" 
                           class="form-control" 
                           placeholder="Ingresa tu contraseña"
                           required>
                    <button type="button" 
                            class="toggle-password position-absolute top-50 translate-middle-y"
                            data-target="#password"
                            aria-label="Mostrar contraseña">
                        <i class="fas fa-eye"></i>
                    </button>
                </div>
                <div class="invalid-feedback">Por favor ingresa tu contraseña</div>
            </div>

            <button type="submit" class="btn-primary">
                <span class="btn-text">
                    <i class="fas fa-sign-in-alt"></i>
                    Iniciar Sesión
                </span>
                <span class="spinner"></span>
            </button>
        </form>

        <!-- Social Login -->
        <div class="auth-social">
            <button class="btn-social" onclick="alert('Próximamente disponible')">
                <span class="social-icon">
                    <!-- SVG oficial de Google 2024 -->
                    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48">
                        <path fill="#FFC107" d="M43.611,20.083H42V20H24v8h11.303c-1.649,4.657-6.08,8-11.303,8c-6.627,0-12-5.373-12-12c0-6.627,5.373-12,12-12c3.059,0,5.842,1.154,7.961,3.039l5.657-5.657C34.046,6.053,29.268,4,24,4C12.955,4,4,12.955,4,24c0,11.045,8.955,20,20,20c11.045,0,20-8.955,20-20C44,22.659,43.862,21.35,43.611,20.083z" />
                        <path fill="#FF3D00" d="M6.306,14.691l6.571,4.819C14.655,15.108,18.961,12,24,12c3.059,0,5.842,1.154,7.961,3.039l5.657-5.657C34.046,6.053,29.268,4,24,4C16.318,4,9.656,8.337,6.306,14.691z" />
                        <path fill="#4CAF50" d="M24,44c5.166,0,9.86-1.977,13.409-5.192l-6.19-5.238C29.211,35.091,26.715,36,24,36c-5.202,0-9.619-3.317-11.283-7.946l-6.522,5.025C9.505,39.556,16.227,44,24,44z" />
                        <path fill="#1976D2" d="M43.611,20.083H42V20H24v8h11.303c-0.792,2.237-2.231,4.166-4.087,5.571c0.001-0.001,0.002-0.001,0.003-0.002l6.19,5.238C36.971,39.205,44,34,44,24C44,22.659,43.862,21.35,43.611,20.083z" />
                    </svg>
                </span>
                <span class="social-text">Continuar con Google</span>
            </button>
        </div>

        <!-- Links -->
        <div class="auth-links">
            <p class="text-muted">
                ¿No tienes cuenta? 
                <a href="{{ url_for('signup') }}">Crear cuenta</a>
            </p>
            <p class="mt-2">
                <a href="#" style="font-size: 0.85rem; color: #94A3B8;">¿Olvidaste tu contraseña?</a>
            </p>
            <p class="mt-3" style="font-size: 0.75rem; color: #94A3B8;">
                <i class="fas fa-shield-alt me-1"></i>
                Tus datos están seguros
            </p>
        </div>
    </div>

    <!-- Scripts -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="{{ url_for('static', filename='js/auth.js') }}"></script>
    
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const firstInput = document.querySelector('input[autofocus]');
            if (firstInput) {
                setTimeout(() => firstInput.focus(), 150);
            }
        });
    </script>
</body>
</html>
